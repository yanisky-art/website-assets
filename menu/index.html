<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YANISKY Navigation</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      background: #ffffff;
      color: #222222;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    button,
    a {
      font: inherit;
      color: inherit;
    }


    /* =========================
       HEADER
       ========================= */

    .site-header {
      width: 100%;
      min-height: 68px;

      display: flex;
      align-items: center;

      padding: 0 28px;
      gap: 42px;

      white-space: nowrap;
    }


    /* =========================
       LOGO
       ========================= */

    .site-logo {
      flex-shrink: 0;

      color: inherit;
      text-decoration: none;

      font-size: 15px;
      font-weight: 650;
      letter-spacing: 0.04em;

      white-space: nowrap;

      transition:
        letter-spacing 260ms ease;
    }

    .site-logo:hover {
      letter-spacing: 0.18em;
    }


    /* =========================
       MAIN NAVIGATION
       ========================= */

    .main-navigation {
      display: flex;
      align-items: center;

      gap: 30px;
    }

    .nav-group {
      position: relative;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      margin: 0;
      padding: 0;

      border: 0;
      background: none;

      color: inherit;
      text-decoration: none;

      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.035em;

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 160ms ease;
    }

    .nav-link:hover {
      opacity: 0.6;
    }

    .nav-group.open > .nav-trigger {
      opacity: 0.6;
    }


    /* =========================
       CHEVRON
       ========================= */

    .chevron {
      display: inline-block;

      width: 6px;
      height: 6px;

      margin-top: -3px;

      border-right: 1px solid currentColor;
      border-bottom: 1px solid currentColor;

      transform: rotate(45deg);
      transform-origin: center;

      transition:
        transform 180ms ease;
    }

    .nav-group.open .chevron {
      transform: rotate(225deg);
    }


    /* =========================
       DROPDOWN
       ========================= */

    .dropdown {
      position: absolute;

      top: 100%;
      left: 0;

      min-width: max-content;

      padding-top: 12px;

      z-index: 10;

      visibility: hidden;
      pointer-events: none;

      opacity: 0;

      transform: translateY(-5px);

      transition:
        opacity 170ms ease,
        transform 170ms ease,
        visibility 170ms;
    }

    .nav-group.open .dropdown {
      visibility: visible;
      pointer-events: auto;

      opacity: 1;

      transform: translateY(0);
    }

    .dropdown-link {
      display: block;

      padding: 5px 0;

      color: inherit;
      text-decoration: none;

      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.035em;

      opacity: 1;

      transition:
        opacity 160ms ease;
    }

    .dropdown-link:hover {
      opacity: 0.6;
    }


    /* =========================
       LANGUAGE
       ========================= */

    .language-switcher {
      margin-left: auto;

      display: flex;
      align-items: center;
      gap: 7px;

      flex-shrink: 0;

      font-size: 12px;
      letter-spacing: 0.035em;
    }

    .language-button {
      margin: 0;
      padding: 0;

      border: 0;
      background: none;

      color: inherit;

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 160ms ease;
    }

    .language-divider {
      opacity: 0.35;
    }

    .language-button:not(.active) {
      opacity: 0.55;
    }

    .language-button:not(.active):hover {
      opacity: 0.8;
    }


    /* =========================
       MOBILE BUTTON
       ========================= */

    .mobile-menu-button {
      display: none;

      width: 28px;
      height: 28px;

      margin: 0 0 0 auto;
      padding: 0;

      position: relative;

      border: 0;
      background: none;

      color: inherit;

      cursor: pointer;
    }

    .mobile-menu-line {
      position: absolute;

      left: 4px;

      width: 20px;
      height: 1px;

      background: currentColor;

      transform-origin: center;

      transition:
        transform 220ms ease,
        top 220ms ease,
        opacity 160ms ease;
    }

    .mobile-menu-line:nth-child(1) {
      top: 8px;
    }

    .mobile-menu-line:nth-child(2) {
      top: 14px;
    }

    .mobile-menu-line:nth-child(3) {
      top: 20px;
    }


    /* ☰ → × */

    .site-header.mobile-open
    .mobile-menu-line:nth-child(1) {
      top: 14px;
      transform: rotate(45deg);
    }

    .site-header.mobile-open
    .mobile-menu-line:nth-child(2) {
      opacity: 0;
    }

    .site-header.mobile-open
    .mobile-menu-line:nth-child(3) {
      top: 14px;
      transform: rotate(-45deg);
    }


    /* =========================
       DARK MODE
       ========================= */

    @media (prefers-color-scheme: dark) {

      body {
        background: #191919;
        color: #ffffff;
      }

    }


    /* =========================
       NARROW DESKTOP
       ========================= */

    @media (max-width: 900px) and (min-width: 701px) {

      .site-header {
        padding-left: 20px;
        padding-right: 20px;

        gap: 26px;
      }

      .main-navigation {
        gap: 20px;
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .site-header {
        min-height: 60px;

        display: grid;

        grid-template-columns:
          1fr auto;

        align-items: center;

        padding: 0 20px;

        gap: 0;

        white-space: normal;
      }


      /* Logo */

      .site-logo {
        grid-column: 1;
        grid-row: 1;

        font-size: 15px;
      }

      .site-logo:hover {
        letter-spacing: 0.04em;
      }


      /* Hamburger */

      .mobile-menu-button {
        display: block;

        grid-column: 2;
        grid-row: 1;
      }


      /* Main navigation */

      .main-navigation {
        grid-column: 1 / -1;
        grid-row: 2;

        display: none;

        width: 100%;

        flex-direction: column;
        align-items: stretch;

        gap: 0;

        padding:
          8px 0 10px;
      }

      .site-header.mobile-open
      .main-navigation {
        display: flex;
      }


      /* Top level links */

      .nav-group {
        width: 100%;
      }

      .nav-link {
        width: 100%;

        min-height: 44px;

        justify-content: space-between;

        font-size: 13px;

        text-align: left;
      }

      a.nav-link {
        justify-content: flex-start;
      }

      .nav-link:hover {
        opacity: 1;
      }

      .nav-group.open > .nav-trigger {
        opacity: 0.6;
      }


      /* Chevron */

      .chevron {
        margin-right: 2px;
      }


      /* Dropdown */

      .dropdown {
        position: static;

        min-width: 0;
        width: 100%;

        padding-top: 0;
        padding-left: 16px;

        max-height: 0;

        overflow: hidden;

        visibility: hidden;
        pointer-events: none;

        opacity: 0;

        transform: none;

        transition:
          max-height 240ms ease,
          opacity 180ms ease,
          visibility 180ms;
      }

      .nav-group.open .dropdown {
        max-height: 160px;

        visibility: visible;
        pointer-events: auto;

        opacity: 1;

        transform: none;
      }

      .dropdown-link {
        min-height: 38px;

        display: flex;
        align-items: center;

        padding: 0;

        font-size: 12px;
      }

      .dropdown-link:hover {
        opacity: 1;
      }


      /* Language */

      .language-switcher {
        display: none;

        grid-column: 1 / -1;
        grid-row: 3;

        margin-left: 0;

        padding:
          8px 0 20px;

        font-size: 12px;
      }

      .site-header.mobile-open
      .language-switcher {
        display: flex;
      }

    }

  
    /* YANISKY ADAPTIVE SCROLLBARS */
    :root{color-scheme:light dark}
    html,body,*{scrollbar-color:#b8b8b8 #f3f3f3;scrollbar-width:thin}
    *::-webkit-scrollbar{width:10px;height:10px}
    *::-webkit-scrollbar-track{background:#f3f3f3}
    *::-webkit-scrollbar-thumb{background:#b8b8b8;border:2px solid #f3f3f3;border-radius:999px}
    *::-webkit-scrollbar-thumb:hover{background:#969696}
    *::-webkit-scrollbar-corner{background:#f3f3f3}
    @media(prefers-color-scheme:dark){
      html,body,*{scrollbar-color:#686868 #191919}
      *::-webkit-scrollbar-track{background:#191919}
      *::-webkit-scrollbar-thumb{background:#686868;border-color:#191919}
      *::-webkit-scrollbar-thumb:hover{background:#858585}
      *::-webkit-scrollbar-corner{background:#191919}
    }

  </style>
</head>


<body>

  <header class="site-header">


    <!-- =========================
         YANISKY
         ========================= -->

    <a
      class="site-logo"
      href="../index.html?page=home"
      target="_top"
    >
      YANISKY
    </a>


    <!-- =========================
         MOBILE BUTTON
         ========================= -->

    <button
      class="mobile-menu-button"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
    >

      <span class="mobile-menu-line"></span>
      <span class="mobile-menu-line"></span>
      <span class="mobile-menu-line"></span>

    </button>


    <!-- =========================
         MAIN NAVIGATION
         ========================= -->

    <nav
      class="main-navigation"
      aria-label="Main navigation"
    >


      <!-- ART -->

      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >

          <span
            data-en="ART"
            data-ru="РАБОТЫ"
          >
            ART
          </span>

          <span
            class="chevron"
            aria-hidden="true"
          ></span>

        </button>


        <div class="dropdown">

          <a
            class="dropdown-link"
            href="../index.html?page=traditional"
            target="_top"
            data-en="TRADITIONAL"
            data-ru="ТРАДИЦИОННОЕ ИСКУССТВО"
          >
            TRADITIONAL
          </a>


          <a
            class="dropdown-link"
            href="../index.html?page=digital"
            target="_top"
            data-en="DIGITAL"
            data-ru="ЦИФРОВОЕ ИСКУССТВО"
          >
            DIGITAL
          </a>


          <a
            class="dropdown-link"
            href="../index.html?page=mixed-media"
            target="_top"
            data-en="MIXED MEDIA"
            data-ru="СМЕШАННЫЕ ТЕХНИКИ"
          >
            MIXED MEDIA
          </a>

        </div>

      </div>


      <!-- PROJECTS -->

      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >

          <span
            data-en="PROJECTS"
            data-ru="ПРОЕКТЫ"
          >
            PROJECTS
          </span>

          <span
            class="chevron"
            aria-hidden="true"
          ></span>

        </button>


        <div class="dropdown">

          <a
            class="dropdown-link"
            href="../index.html?page=game"
            target="_top"
            data-en="GAMES"
            data-ru="ИГРЫ"
          >
            GAMES
          </a>

        </div>

      </div>


      <!-- EVENTS -->

      <div class="nav-group">

        <button
          class="nav-link nav-trigger"
          type="button"
          aria-expanded="false"
        >

          <span
            data-en="EVENTS"
            data-ru="СОБЫТИЯ"
          >
            EVENTS
          </span>

          <span
            class="chevron"
            aria-hidden="true"
          ></span>

        </button>


        <div class="dropdown">

          <a
            class="dropdown-link"
            href="../index.html?page=events"
            target="_top"
            data-en="EXHIBITIONS & OPEN CALLS"
            data-ru="ВЫСТАВКИ & OPEN CALLS"
          >
            EXHIBITIONS &amp; OPEN CALLS
          </a>


          <a
            class="dropdown-link"
            href="../index.html?page=events"
            target="_top"
            data-en="GAME JAMS"
            data-ru="GAME JAMS"
          >
            GAME JAMS
          </a>

        </div>

      </div>


      <!-- ABOUT / CONTACT -->

      <a
        class="nav-link"
        href="../index.html?page=about"
        target="_top"
        data-en="ABOUT / CONTACT"
        data-ru="ОБО МНЕ / КОНТАКТЫ"
      >
        ABOUT / CONTACT
      </a>

    </nav>


    <!-- =========================
         LANGUAGE
         ========================= -->

    <div
      class="language-switcher"
      aria-label="Language"
    >

      <button
        class="language-button active"
        type="button"
        data-language="en"
      >
        EN
      </button>

      <span class="language-divider">
        |
      </span>

      <button
        class="language-button"
        type="button"
        data-language="ru"
      >
        RU
      </button>

    </div>

  </header>


  <script>

    /* =========================
       SITE PAGE ROUTING
       ========================= */
    document.querySelectorAll('a[href*="?page="]').forEach((link) => {
      link.addEventListener("click", (event) => {
        const page = new URL(link.href, location.href).searchParams.get("page");
        if (!page) return;
        try {
          const topUrl = new URL(window.top.location.href);
          if (topUrl.pathname.endsWith("/preview.html")) {
            event.preventDefault();
            topUrl.searchParams.set("page", page);
            topUrl.searchParams.set("preview", Date.now().toString());
            window.top.location.href = topUrl.toString();
          }
        } catch (e) {}
      });
    });


    /* =========================
       ELEMENTS
       ========================= */

    const siteHeader =
      document.querySelector(".site-header");

    const mobileMenuButton =
      document.querySelector(".mobile-menu-button");

    const navGroups =
      document.querySelectorAll(".nav-group");


    /* =========================
       MOBILE CHECK
       ========================= */

    function isMobile() {

      return window.matchMedia(
        "(max-width: 700px)"
      ).matches;

    }


    /* =========================
       DROPDOWNS
       ========================= */

    function openDropdown(group) {

      navGroups.forEach((otherGroup) => {

        if (otherGroup !== group) {
          closeDropdown(otherGroup);
        }

      });

      group.classList.add("open");

      const trigger =
        group.querySelector(".nav-trigger");

      trigger.setAttribute(
        "aria-expanded",
        "true"
      );

    }


    function closeDropdown(group) {

      group.classList.remove("open");

      const trigger =
        group.querySelector(".nav-trigger");

      trigger.setAttribute(
        "aria-expanded",
        "false"
      );

    }


    function closeAllDropdowns() {

      navGroups.forEach((group) => {
        closeDropdown(group);
      });

    }


    navGroups.forEach((group) => {

      const trigger =
        group.querySelector(".nav-trigger");


      /* Hover only on desktop */

      group.addEventListener(
        "mouseenter",
        () => {

          if (!isMobile()) {
            openDropdown(group);
          }

        }
      );


      group.addEventListener(
        "mouseleave",
        () => {

          if (!isMobile()) {
            closeDropdown(group);
          }

        }
      );


      /* Click */

      trigger.addEventListener(
        "click",
        (event) => {

          event.stopPropagation();

          const isOpen =
            group.classList.contains("open");

          if (isOpen) {
            closeDropdown(group);
          } else {
            openDropdown(group);
          }

        }
      );

    });


    /* =========================
       MOBILE MENU
       ========================= */

    function openMobileMenu() {

      siteHeader.classList.add(
        "mobile-open"
      );

      mobileMenuButton.setAttribute(
        "aria-expanded",
        "true"
      );

      mobileMenuButton.setAttribute(
        "aria-label",
        "Close menu"
      );

    }


    function closeMobileMenu() {

      siteHeader.classList.remove(
        "mobile-open"
      );

      mobileMenuButton.setAttribute(
        "aria-expanded",
        "false"
      );

      mobileMenuButton.setAttribute(
        "aria-label",
        "Open menu"
      );

      closeAllDropdowns();

    }


    mobileMenuButton.addEventListener(
      "click",
      (event) => {

        event.stopPropagation();

        const isOpen =
          siteHeader.classList.contains(
            "mobile-open"
          );

        if (isOpen) {
          closeMobileMenu();
        } else {
          openMobileMenu();
        }

      }
    );


    /* =========================
       CLICK OUTSIDE
       ========================= */

    document.addEventListener(
      "click",
      (event) => {

        if (
          !siteHeader.contains(
            event.target
          )
        ) {

          closeAllDropdowns();

          if (isMobile()) {
            closeMobileMenu();
          }

        }

      }
    );


    /* =========================
       ESCAPE
       ========================= */

    document.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Escape") {

          closeAllDropdowns();

          if (isMobile()) {
            closeMobileMenu();
          }

        }

      }
    );


    /* =========================
       RESIZE
       ========================= */

    window.addEventListener(
      "resize",
      () => {

        if (!isMobile()) {

          siteHeader.classList.remove(
            "mobile-open"
          );

          mobileMenuButton.setAttribute(
            "aria-expanded",
            "false"
          );

        }

      }
    );


    /* =========================
       LANGUAGE
       ========================= */

    const languageButtons =
      document.querySelectorAll(
        ".language-button"
      );

    const translatedElements =
      document.querySelectorAll(
        "[data-en][data-ru]"
      );

    const LANGUAGE_STORAGE_KEY =
      "yaniskyLanguage";


    function setLanguage(language) {

      if (
        language !== "en" &&
        language !== "ru"
      ) {

        language = "en";

      }


      translatedElements.forEach(
        (element) => {

          const translation =
            element.dataset[language];

          if (
            translation !== undefined
          ) {

            element.textContent =
              translation;

          }

        }
      );


      languageButtons.forEach(
        (button) => {

          const isActive =
            button.dataset.language ===
            language;

          button.classList.toggle(
            "active",
            isActive
          );

        }
      );


      document.documentElement.lang =
        language;

    }


    function saveLanguage(language) {

      localStorage.setItem(
        LANGUAGE_STORAGE_KEY,
        language
      );

    }


    languageButtons.forEach(
      (button) => {

        button.addEventListener(
          "click",
          (event) => {

            event.stopPropagation();

            const language =
              button.dataset.language;

            setLanguage(language);
            saveLanguage(language);

          }
        );

      }
    );


    /* =========================
       RESTORE LANGUAGE
       ========================= */

    const savedLanguage =
      localStorage.getItem(
        LANGUAGE_STORAGE_KEY
      );


    if (
      savedLanguage === "en" ||
      savedLanguage === "ru"
    ) {

      setLanguage(savedLanguage);

    } else {

      setLanguage("en");

    }

  </script>

</body>
</html>
