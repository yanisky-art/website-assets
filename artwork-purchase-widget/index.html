<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artwork Purchase Widget</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,sans-serif;color:#282828}.widget{padding:2px}.status{font-size:12px;margin-bottom:10px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4e9a62;margin-right:8px}.status.reserved:before{background:#bd9145}.status.sold:before{background:#888}.price{font-family:Georgia,serif;font-size:30px;margin:0 0 14px}.actions{display:grid;grid-template-columns:1fr;gap:8px}.buy{min-height:46px;border:1px solid #222;background:#222;color:#fff;border-radius:10px;font-weight:600;cursor:pointer}.buy:disabled{background:transparent;color:#888;border-color:#bbb;cursor:not-allowed}.note{font-size:11px;line-height:1.5;color:#777;margin-top:9px}.state{min-height:150px;display:grid;place-items:center;padding:25px;text-align:center;border:1px dashed #bbb;color:#777;font-size:13px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.box{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px}.head{display:flex;justify-content:space-between;gap:18px}.head h2{font-family:Georgia,serif;font-weight:400;margin:0 0 4px}.close{border:0;background:none;font-size:25px;cursor:pointer}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}.tabs button{border:1px solid #bbb;background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer}.tabs button.active{background:#222;color:#fff;border-color:#222}.kind{font-size:12px;color:#666;margin-bottom:16px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#666;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #bbb;border-radius:8px;padding:10px;background:#fff;color:#222}.field textarea{min-height:85px;resize:vertical}.check{display:flex;gap:8px;font-size:11px;line-height:1.4;margin:14px 0}.submit{width:100%;min-height:44px;border:0;border-radius:9px;background:#222;color:#fff;font-weight:700;cursor:pointer}.request-state{font-size:12px;margin-top:9px}.success{text-align:center;padding:12px}.success h2{font-family:Georgia,serif;font-weight:400}
</style></head><body><div id="app" class="widget"><div class="state">Загрузка…</div></div><div id="modal" class="modal"></div><script>
const app=document.querySelector("#app"),modal=document.querySelector("#modal"),params=new URLSearchParams(location.search),slug=params.get("slug")||"",lang=(params.get("lang")||"ru")==="en"?"en":"ru";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),pick=v=>v&&typeof v==="object"&&!Array.isArray(v)?(v[lang]||v.ru||v.en||""):(v??"");
function notifySize(){requestAnimationFrame(()=>parent.postMessage({type:"yanisky-widget-size",height:Math.ceil(document.documentElement.scrollHeight)},"*"))}
function money(a){const p=Number(a.originalPriceUsd);return p>0?"$"+Math.round(p).toLocaleString("en-US"):(lang==="en"?"Price on request":"Цена по запросу")}
function commerce(a){const s=a.commercialStatus||"available",priced=Number(a.originalPriceUsd)>0;if(s==="sold")return{status:lang==="en"?"Sold":"Продано",label:lang==="en"?"Artwork sold":"Работа продана",disabled:true,note:lang==="en"?"The original is no longer available.":"Оригинал больше не доступен для покупки."};if(s==="reserved")return{status:lang==="en"?"Reserved":"Зарезервировано",label:lang==="en"?"Ask about availability":"Уточнить доступность",disabled:false,note:lang==="en"?"The artwork is reserved. You can still send an inquiry.":"Работа зарезервирована. Можно оставить запрос на случай изменения статуса."};return{status:lang==="en"?"Available":"В наличии",label:priced?(lang==="en"?"Inquire about artwork":"Запросить работу"):(lang==="en"?"Request price":"Запросить цену"),disabled:false,note:priced?(lang==="en"?"Send an inquiry to discuss purchase and delivery.":"Отправь запрос, чтобы уточнить покупку и доставку."):(lang==="en"?"Price and purchase terms are available on request.":"Цена и условия покупки предоставляются по запросу.")}}
let artwork=null,purchaseKind="original";
function kindLabel(){return purchaseKind==="reproduction"?(lang==="en"?"Reproduction":"Репродукция"):purchaseKind==="commercial_file"?(lang==="en"?"Commercial digital file":"Коммерческий электронный файл"):(lang==="en"?"Original":"Оригинал")}
function renderRequest(){const shipping=purchaseKind!=="commercial_file",extra=purchaseKind==="reproduction"?'<div class="field"><label>Желаемый размер / вариант репродукции</label><input id="rqVariant" placeholder="Например: 30 × 40 см"></div>':purchaseKind==="commercial_file"?'<div class="field"><label>Цель коммерческого использования</label><textarea id="rqUse"></textarea></div><div class="field"><label>Желаемый формат файла</label><select id="rqFormat"><option value="">Не знаю / обсудить</option><option>JPEG</option><option>PNG</option><option>TIFF</option><option>PSD</option></select></div>':"";
modal.innerHTML='<div class="box"><div class="head"><div><h2>Запрос по работе</h2><div>'+esc(pick(artwork.title)||"Artwork")+'</div></div><button class="close" aria-label="Закрыть">×</button></div><div class="tabs"><button data-kind="original" class="'+(purchaseKind==="original"?"active":"")+'">Оригинал</button><button data-kind="reproduction" class="'+(purchaseKind==="reproduction"?"active":"")+'">Репродукция</button><button data-kind="commercial_file" class="'+(purchaseKind==="commercial_file"?"active":"")+'">Электронный файл</button></div><div class="kind">В заявку автоматически попадёт: '+kindLabel()+'</div><form id="form"><div class="field"><label>E-mail *</label><input id="rqEmail" type="email" required autocomplete="email"></div>'+(shipping?'<div class="field"><label>Страна доставки *</label><input id="rqCountry" required autocomplete="country-name"></div>':"")+extra+'<div class="field"><label>Комментарий или вопрос</label><textarea id="rqComment"></textarea></div><label class="check"><input id="rqConsent" type="checkbox" required><span>Я согласен(на) на использование указанного e-mail и данных заявки для ответа на мой запрос.</span></label><button class="submit" type="submit">Отправить запрос</button><div id="rqState" class="request-state"></div></form></div>';
modal.querySelector(".close").onclick=()=>modal.classList.remove("open");modal.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{purchaseKind=b.dataset.kind;renderRequest()});modal.querySelector("#form").onsubmit=submitRequest}
async function submitRequest(e){e.preventDefault();const btn=modal.querySelector(".submit"),state=modal.querySelector("#rqState"),email=modal.querySelector("#rqEmail").value.trim(),formData={purchaseKind,purchaseKindLabel:kindLabel(),country:modal.querySelector("#rqCountry")?.value.trim()||null,reproductionVariant:modal.querySelector("#rqVariant")?.value.trim()||null,commercialUse:modal.querySelector("#rqUse")?.value.trim()||null,fileFormat:modal.querySelector("#rqFormat")?.value||null,comment:modal.querySelector("#rqComment").value.trim()||null,consent:true};btn.disabled=true;state.textContent="Отправляем…";try{const r=await fetch("https://jzjpmmtrfrrnzbyrvuof.supabase.co/functions/v1/submit-order-request",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({source:"artwork",requestType:purchaseKind,email,artworkId:artwork.id,formData,quoteSnapshot:{purchaseKind,purchaseKindLabel:kindLabel(),displayedPrice:purchaseKind==="original"?money(artwork):null,artworkStatus:artwork.commercialStatus||"available",capturedAt:new Date().toISOString()}})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Ошибка");modal.querySelector(".box").innerHTML='<div class="success"><h2>Запрос отправлен</h2><p>Спасибо. Я получил ваш запрос и смогу ответить по указанному e-mail.</p><button class="submit" type="button">Закрыть</button></div>';modal.querySelector(".submit").onclick=()=>modal.classList.remove("open")}catch(err){btn.disabled=false;state.textContent="Не удалось отправить запрос. Попробуйте ещё раз."}}
async function run(){if(!slug){app.innerHTML='<div class="state">Artwork Purchase<br>Открой шаблон с параметром <b>?slug=…</b>, чтобы проверить покупку конкретной работы.</div>';notifySize();return}try{const r=await fetch("../public-data/artworks.json",{cache:"no-store"});if(!r.ok)throw 0;const arts=await r.json();artwork=arts.find(x=>x.slug===slug||x.id===slug);if(!artwork){app.innerHTML='<div class="state">Работа не найдена или не опубликована.</div>';notifySize();return}const cm=commerce(artwork);app.innerHTML='<div class="status '+esc(artwork.commercialStatus||"available")+'">'+esc(cm.status)+'</div><div class="price">'+esc(money(artwork))+'</div><div class="actions"><button id="buy" class="buy" '+(cm.disabled?"disabled":"")+'>'+esc(cm.label)+'</button></div><div class="note">'+esc(cm.note)+'</div>';const b=document.querySelector("#buy");if(b&&!cm.disabled)b.onclick=()=>{purchaseKind="original";renderRequest();modal.classList.add("open")};notifySize()}catch(e){app.innerHTML='<div class="state">Не удалось загрузить данные покупки.</div>';notifySize()}}
modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("open")});run();window.addEventListener("resize",notifySize);
</script></body></html>
