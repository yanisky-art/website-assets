<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YANISKY</title>
<meta name="description" content="YANISKY - artist portfolio">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#191919;color:#f5f5f5;font-family:Arial,sans-serif}
#grid{width:100vw;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:6px;align-items:start}
.block{grid-column:var(--x,auto)/span var(--span,24);grid-row:var(--y,auto)/span var(--gh,auto);min-width:0;height:var(--h,auto);position:relative;overflow:visible;container-type:inline-size}#grid.grid2d{grid-auto-rows:24px}.grid2d .block{height:auto}.grid2d .block iframe{height:100%}
.block:not(:has(iframe)){padding:24px}.block iframe{display:block;width:100%;height:420px;border:0!important;outline:0!important;box-shadow:none!important;background:#191919;pointer-events:auto;position:relative;z-index:1}.block:focus,.block:focus-visible,.block iframe:focus,.block iframe:focus-visible{outline:0!important;border:0!important;box-shadow:none!important}
.title{font:600 clamp(18px,5.2cqw,30px) Georgia,serif;margin:0 0 10px}.text{font-size:clamp(10px,1.9cqw,15px);line-height:1.5;margin:0}
@media(max-width:900px){#grid{gap:4px}.block{grid-column:1/-1!important}.block:not(:has(iframe)){padding:clamp(14px,4vw,24px)}}
</style>
</head>
<body>
<main id="grid"></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const markup=b=>{if(b.type==="text")return '<h3 class="title">'+esc(b.title||"Заголовок")+'</h3><p class="text">'+esc(b.text||"")+'</p>';if(b.type==="image")return '<div class="img">'+esc(b.title||"Изображение")+'</div>';if(b.type==="button")return '<h3 class="title">'+esc(b.title||"Кнопка")+'</h3><span class="btn">'+esc(b.text||"Открыть")+'</span>';if(b.type==="site-menu")return '<iframe src="./menu/" scrolling="no"></iframe>';if(b.type==="price-calculator")return '<iframe src="./price-calculator/" scrolling="no"></iframe>';if(b.type==="divider")return '<div class="divider"></div>';if(b.type==="spacer")return '';const u=b.url||b.widget?.url||"";return u?'<iframe src="'+esc(u)+'" scrolling="no"></iframe>':''};
async function render(){const grid=document.getElementById("grid");try{const params=new URLSearchParams(location.search);let state=null;if(params.get("draft")==="1"){try{state=JSON.parse(localStorage.getItem("yaniskyPageBuilderDraft")||"null")}catch(e){}}if(!state){const r=await fetch("./site-data.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("published data");state=await r.json();}const id=new URLSearchParams(location.search).get("page")||"home";const page=state.pages.find(p=>p.id===id)||state.pages.find(p=>p.id==="home")||state.pages[0];if(page?.grid2DVersion===1)grid.classList.add("grid2d");document.title=(page?.name||"YANISKY")+" - YANISKY";const device=innerWidth<=600?"mobile":innerWidth<=900?"tablet":"desktop";(page?.blocks||[]).forEach(b=>{if(b.visible===false||b.deviceVisibility?.[device]===false)return;const e=document.createElement("section");e.className="block";let span=Number(b.span)||24;if((b.gridVersion||12)===12)span=Math.min(24,span*2);const isSiteMenu=b.type==="site-menu";e.style.setProperty("--span",isSiteMenu?24:Math.max(1,Math.min(24,Number(b.gridW)||span)));if(isSiteMenu)e.style.setProperty("--x",1);if(page?.grid2DVersion===1){e.style.setProperty("--x",Number(b.gridX)||1);e.style.setProperty("--y",Number(b.gridY)||1);e.style.setProperty("--gh",Number(b.gridH)||14)}else if(Number(b.height)>0)e.style.setProperty("--h",Number(b.height)+"px");e.style.opacity=Math.max(0,Math.min(100,Number(b.opacity??100)))/100;e.innerHTML=markup(b);grid.appendChild(e)})}catch(e){grid.innerHTML='<section class="block"><p class="text">Site is temporarily unavailable.</p></section>'}}
render();
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="yanisky-widget-size"||!Number.isFinite(Number(d.height)))return;document.querySelectorAll(".block iframe").forEach(frame=>{if(frame.contentWindow===e.source){const h=Math.max(72,Math.ceil(Number(d.height)));if(!frame.closest(".block").style.getPropertyValue("--h"))frame.style.height=h+"px"}})});
</script>
</body>
</html>
