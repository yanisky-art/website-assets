<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YANISKY Preview</title><style>
html,body{margin:0;min-height:100%;background:#191919;color:#f5f5f5;font-family:Arial,sans-serif;overflow-x:hidden}#preview-stage{width:100%;margin:0}#grid{width:100%;max-width:none;margin:0;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:calc(6px * var(--layout-scale,1));align-items:start}.block{grid-column:var(--x,auto)/span var(--span,24);grid-row:var(--y,auto)/span var(--gh,auto);min-width:0;height:var(--h,auto);box-sizing:border-box;position:relative;overflow:visible;container-type:inline-size;opacity:var(--opacity,1)}#grid.grid2d{grid-auto-rows:calc(24px * var(--layout-scale,1))}.grid2d .block{height:var(--preview-block-height,auto)}.grid2d .block iframe{height:100%}.block:not(:has(iframe)){padding:24px}.block iframe{display:block;width:100%;height:420px;min-height:0;border:0!important;outline:0!important;box-shadow:none!important;background:#191919;pointer-events:auto;position:relative;z-index:1}.block[style*="--h:"] iframe{height:100%}.block:focus,.block:focus-visible,.block iframe:focus,.block iframe:focus-visible{outline:0!important;border:0!important;box-shadow:none!important}.title{font:600 clamp(18px,5.2cqw,30px) Georgia,serif;margin:0 0 10px}.text{font-size:clamp(10px,1.9cqw,15px);line-height:1.5;margin:0}.btn{display:inline-block;padding:10px 16px;border:1px solid currentColor;border-radius:999px}.img{min-height:180px;border:1px dashed #666;display:grid;place-items:center}.divider{border-top:1px solid #555}@media(max-width:900px){#grid{gap:4px}.block{grid-column:1/-1!important}.block:not(:has(iframe)){padding:clamp(14px,4vw,24px)}}</style></head><body><div id="preview-stage"><main id="grid"></main></div><script>
const PREVIEW_SOURCE_WIDTH_KEY="yaniskyPreviewSourceWidth";
const previewStage=document.getElementById("preview-stage");
const gridElement=document.getElementById("grid");
function syncPreviewLayout(){
  const source=Math.max(1,Number(localStorage.getItem(PREVIEW_SOURCE_WIDTH_KEY))||innerWidth);
  const scale=innerWidth/source;
  previewStage.style.width="100%";
  previewStage.style.zoom="";
  gridElement.style.setProperty("--layout-scale",String(scale));
}
syncPreviewLayout();
window.addEventListener("resize",syncPreviewLayout);
const PREVIEW_BLOCK_GEOMETRY_KEY="yaniskyPreviewBlockGeometry";
let previewBlockGeometry={};try{previewBlockGeometry=JSON.parse(localStorage.getItem(PREVIEW_BLOCK_GEOMETRY_KEY)||"{}")}catch(e){}
const KEY="yaniskyPageBuilderDraft",esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));let state=null;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}const grid=document.getElementById("grid");if(!state||!state.pages){grid.innerHTML='<section class="block"><p class="text">Черновик не найден. Вернись в Page Builder и нажми «Сохранить черновик».</p></section>'}else{const id=new URLSearchParams(location.search).get("page")||state.currentPage||"home",page=state.pages.find(p=>p.id===id)||state.pages[0];if(page?.grid2DVersion===1)grid.classList.add("grid2d");document.title=(page?.name||"YANISKY")+" - Preview";const markup=b=>{if(b.visible===false)return "";const device=(innerWidth<=600?"mobile":innerWidth<=900?"tablet":"desktop");if(b.deviceVisibility&&b.deviceVisibility[device]===false)return "";if(b.type==="text")return '<h3 class="title">'+esc(b.title||"Заголовок")+'</h3><p class="text">'+esc(b.text||"")+'</p>';if(b.type==="image")return '<div class="img">'+esc(b.title||"Изображение")+'</div>';if(b.type==="button")return '<h3 class="title">'+esc(b.title||"Кнопка")+'</h3><span class="btn">'+esc(b.text||"Открыть")+'</span>';if(b.type==="site-menu")return '<iframe src="./menu/" scrolling="no"></iframe>';if(b.type==="price-calculator")return '<iframe src="./price-calculator/" scrolling="no"></iframe>';if(b.type==="divider")return '<div class="divider"></div>';if(b.type==="spacer")return '';const url=b.url||b.widget?.url||"";return url?'<iframe src="'+esc(url)+'" scrolling="no"></iframe>':''};(page?.blocks||[]).forEach(b=>{const e=document.createElement("section");e.className="block";let span=Number(b.span)||24;if((b.gridVersion||12)===12)span=Math.min(24,span*2);e.style.setProperty("--span",Math.max(1,Math.min(24,Number(b.gridW)||span)));if(page?.grid2DVersion===1){e.style.setProperty("--x",Number(b.gridX)||1);e.style.setProperty("--y",Number(b.gridY)||1);e.style.setProperty("--gh",Number(b.gridH)||14);const source=Math.max(1,Number(localStorage.getItem(PREVIEW_SOURCE_WIDTH_KEY))||innerWidth),scale=innerWidth/source,g=previewBlockGeometry[b.id];if(g&&Number(g.height)>0)e.style.setProperty("--preview-block-height",(Number(g.height)*scale)+"px")}else if(Number(b.height)>0)e.style.setProperty("--h",Number(b.height)+"px");e.style.setProperty("--opacity",Math.max(0,Math.min(100,Number(b.opacity??100)))/100);e.innerHTML=markup(b);grid.appendChild(e)})
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="yanisky-widget-size"||!Number.isFinite(Number(d.height)))return;document.querySelectorAll(".block iframe").forEach(frame=>{if(frame.contentWindow===e.source){const h=Math.max(72,Math.ceil(Number(d.height)));const block=frame.closest(".block");if(block&&!(block.style.getPropertyValue("--h")||"").trim()){frame.style.height=h+"px";block.style.height=h+"px"}}})});}</script></body></html>
