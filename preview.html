<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YANISKY Preview</title><style>
html,body{margin:0;min-height:100%;background:#191919;color:#f5f5f5;font-family:Arial,sans-serif}#grid{width:100%;max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:6px;align-items:start}.block{grid-column:span var(--span,24);min-width:0;height:var(--h,auto);box-sizing:border-box;position:relative;overflow:visible;container-type:inline-size}.block:not(:has(iframe)){padding:24px}.block iframe{display:block;width:100%;height:100%;min-height:420px;border:0;background:#191919}.block[style*="--h:"] iframe{min-height:0}.title{font:600 clamp(18px,5.2cqw,30px) Georgia,serif;margin:0 0 10px}.text{font-size:clamp(10px,1.9cqw,15px);line-height:1.5;margin:0}.btn{display:inline-block;padding:10px 16px;border:1px solid currentColor;border-radius:999px}.img{min-height:180px;border:1px dashed #666;display:grid;place-items:center}.divider{border-top:1px solid #555}@media(max-width:600px){.block{grid-column:1/-1!important}}</style></head><body><main id="grid"></main><script>
const KEY="yaniskyPageBuilderDraft",esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));let state=null;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}const grid=document.getElementById("grid");if(!state||!state.pages){grid.innerHTML='<section class="block"><p class="text">Черновик не найден. Вернись в Page Builder и нажми «Сохранить черновик».</p></section>'}else{const id=new URLSearchParams(location.search).get("page")||state.currentPage||"home",page=state.pages.find(p=>p.id===id)||state.pages[0];document.title=(page?.name||"YANISKY")+" - Preview";const markup=b=>{if(b.type==="text")return '<h3 class="title">'+esc(b.title||"Заголовок")+'</h3><p class="text">'+esc(b.text||"")+'</p>';if(b.type==="image")return '<div class="img">'+esc(b.title||"Изображение")+'</div>';if(b.type==="button")return '<h3 class="title">'+esc(b.title||"Кнопка")+'</h3><span class="btn">'+esc(b.text||"Открыть")+'</span>';if(b.type==="site-menu")return '<iframe src="./menu/" scrolling="no"></iframe>';if(b.type==="price-calculator")return '<iframe src="./price-calculator/" scrolling="no"></iframe>';if(b.type==="divider")return '<div class="divider"></div>';if(b.type==="spacer")return '';const url=b.url||b.widget?.url||"";return url?'<iframe src="'+esc(url)+'" scrolling="no"></iframe>':''};(page?.blocks||[]).forEach(b=>{const e=document.createElement("section");e.className="block";let span=Number(b.span)||24;if((b.gridVersion||12)===12)span=Math.min(24,span*2);e.style.setProperty("--span",Math.max(1,Math.min(24,span)));if(Number(b.height)>0)e.style.setProperty("--h",Number(b.height)+"px");e.innerHTML=markup(b);grid.appendChild(e)})}</script></body></html>
