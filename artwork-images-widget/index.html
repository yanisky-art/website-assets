<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artwork Images Widget</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:#222;font-family:Arial,sans-serif}
.widget{width:100%}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:260px;background:#f4f4f2;overflow:hidden}
.hero{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;object-fit:contain}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:1px solid rgba(0,0,0,.35);border-radius:50%;background:rgba(255,255,255,.82);font-size:24px;cursor:pointer}
.prev{left:12px}.next{right:12px}
.counter{position:absolute;left:12px;bottom:12px;padding:6px 9px;background:rgba(255,255,255,.86);font-size:11px}
.thumbs{height:100px;display:flex;gap:8px;margin-top:8px;overflow-x:auto;overflow-y:hidden}
.thumb{height:100%;min-width:100px;border:1px solid transparent;padding:0;background:#f4f4f2;cursor:pointer}
.thumb.active{border-color:#222}.thumb img{width:100%;height:100%;display:block;object-fit:contain}
.state{min-height:220px;display:grid;place-items:center;padding:30px;text-align:center;border:1px dashed #bbb;color:#777;font-size:13px}
@media(max-width:600px){.stage{min-height:180px}.hero{max-height:65vh}.thumbs{height:76px}.thumb{min-width:78px}}
</style>
</head>
<body>
<div id="app" class="widget"><div class="state">Загрузка изображений…</div></div>
<script>
const app=document.querySelector("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const params=new URLSearchParams(location.search);
const slug=params.get("slug")||"";
function imageUrl(im,thumb=false){
  return thumb?(im.thumbnailUrl||im.displayUrl||im.webUrl||im.originalUrl||""):(im.displayUrl||im.webUrl||im.thumbnailUrl||im.originalUrl||"");
}
function notifySize(){requestAnimationFrame(()=>parent.postMessage({type:"yanisky-widget-size",height:Math.ceil(document.documentElement.scrollHeight)},"*"))}
async function run(){
  if(!slug){app.innerHTML='<div class="state">Artwork Images<br>В предпросмотре открой шаблон с параметром <b>?slug=…</b>, чтобы увидеть изображения конкретной работы.</div>';notifySize();return}
  try{
    const r=await fetch("../public-data/artworks.json",{cache:"no-store"});
    if(!r.ok)throw new Error("artworks");
    const arts=await r.json();
    const artwork=arts.find(x=>x.slug===slug||x.id===slug);
    if(!artwork){app.innerHTML='<div class="state">Работа не найдена или не опубликована.</div>';notifySize();return}
    const images=[...(artwork.images||[])].sort((a,b)=>(Number(b.isMain)-Number(a.isMain))||((Number(a.sortOrder)||0)-(Number(b.sortOrder)||0))).filter(im=>imageUrl(im));
    if(!images.length){app.innerHTML='<div class="state">Для этой работы пока нет публичных изображений.</div>';notifySize();return}
    const title=artwork.altText?.ru||artwork.altText?.en||artwork.title?.ru||artwork.title?.en||"Artwork";
    app.innerHTML='<div class="stage"><img id="hero" class="hero" alt="'+esc(title)+'">'+(images.length>1?'<button class="arrow prev" id="prev" type="button" aria-label="Предыдущее изображение">‹</button><button class="arrow next" id="next" type="button" aria-label="Следующее изображение">›</button><span class="counter" id="counter"></span>':"")+'</div>'+(images.length>1?'<div class="thumbs">'+images.map((im,i)=>'<button class="thumb'+(i===0?" active":"")+'" data-i="'+i+'" type="button"><img loading="lazy" src="'+esc(imageUrl(im,true))+'" alt=""></button>').join("")+'</div>':"");
    let index=0;const hero=document.querySelector("#hero"),counter=document.querySelector("#counter");
    function show(i){index=(i+images.length)%images.length;hero.src=imageUrl(images[index]);if(counter)counter.textContent=(index+1)+" / "+images.length;document.querySelectorAll(".thumb").forEach((x,j)=>x.classList.toggle("active",j===index));notifySize()}
    document.querySelectorAll(".thumb").forEach(x=>x.onclick=()=>show(Number(x.dataset.i)));
    document.querySelector("#prev")?.addEventListener("click",()=>show(index-1));
    document.querySelector("#next")?.addEventListener("click",()=>show(index+1));
    hero.addEventListener("load",notifySize);show(0);
  }catch(e){app.innerHTML='<div class="state">Не удалось загрузить изображения работы.</div>';notifySize()}
}
run();window.addEventListener("resize",notifySize);
</script>
</body>
</html>
