const app=document.querySelector("#app"),modal=document.querySelector("#modal"),params=new URLSearchParams(location.search),slug=params.get("slug")||"",lang=(params.get("lang")||"ru")==="en"?"en":"ru",theme=params.get("theme")||((window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");document.documentElement.dataset.theme=theme;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),pick=v=>v&&typeof v==="object"&&!Array.isArray(v)?(v[lang]||v.ru||v.en||""):(v??"");

function commerce(a){const s=a.commercialStatus||"available",priced=Number(a.originalPriceUsd)>0;if(s==="sold")return{status:lang==="en"?"Sold":"Продано",label:lang==="en"?"Artwork sold":"Работа продана",disabled:true,note:lang==="en"?"The original is no longer available.":"Оригинал больше не доступен для покупки."};if(s==="reserved")return{status:lang==="en"?"Reserved":"Зарезервировано",label:lang==="en"?"Ask about availability":"Уточнить доступность",disabled:false,note:lang==="en"?"The artwork is reserved. You can still send an inquiry.":"Работа зарезервирована. Можно оставить запрос."};return{status:lang==="en"?"Available":"В наличии",label:priced?(lang==="en"?"Buy artwork":"Купить работу"):(lang==="en"?"Request price":"Запросить цену"),disabled:false,note:priced?(lang==="en"?"Send an inquiry to discuss purchase and delivery.":"Отправь запрос, чтобы уточнить покупку и доставку."):(lang==="en"?"Price and purchase terms are available on request.":"Цена и условия покупки предоставляются по запросу.")}}

modal.innerHTML='<div class="box"><div class="head"><div><h2>Запрос по работе</h2><div>'+esc(pick(artwork.title)||"Artwork")+'</div></div><button class="close">×</button></div><div class="tabs"><button data-kind="original" class="'+(purchaseKind==="original"?"active":"")+'">Оригинал</button><button data-kind="reproduction" class="'+(purchaseKind==="reproduction"?"active":"")+'">Репродукция</button><button data-kind="commercial_file" class="'+(purchaseKind==="commercial_file"?"active":"")+'">Электронный файл</button></div><div class="kind">В заявку автоматически попадёт: '+kindLabel()+'</div><form id="rqForm"><div class="field"><label>E-mail *</label><input id="rqEmail" type="email" required></div>'+(shipping?'<div class="field"><label>Страна доставки *</label><input id="rqCountry" required></div>':"")+extra+'<div class="field"><label>Комментарий или вопрос</label><textarea id="rqComment"></textarea></div><label class="check"><input id="rqConsent" type="checkbox" required><span>Я согласен(на) на использование e-mail и данных заявки для ответа на запрос.</span></label><button class="submit">Отправить запрос</button><div id="rqState" class="rqstate"></div></form></div>';

async function run(){if(!slug){app.innerHTML='<div class="state">Страница работы<br>Добавь <b>?slug=…</b>, чтобы увидеть конкретную опубликованную работу.</div>';notify();return}try{const [ar,sr,dr]=await Promise.all([fetch("../public-data/artworks.json",{cache:"no-store"}),fetch("../public-data/series.json",{cache:"no-store"}),fetch("../public-data/dictionaries.json",{cache:"no-store"})]);if(!ar.ok)throw 0;const arts=await ar.json(),series=sr.ok?await sr.json():[],dict=dr.ok?await dr.json():[];artwork=arts.find(x=>x.slug===slug||x.id===slug);if(!artwork){app.innerHTML='<div class="state">Работа не найдена или не опубликована.</div>';notify();return}const images=[...(artwork.images||[])].filter(imgUrl).sort((a,b)=>(Number(b.isMain)-Number(a.isMain))||(Number(a.sortOrder)-Number(b.sortOrder))),ser=series.find(s=>s.id===artwork.seriesId),tech=dictText(artwork.techniqueIds,dict),materials=dictText(artwork.materialIds,dict),support=dictText(artwork.supportId?[artwork.supportId]:[],dict),cm=commerce(artwork),description=pick(artwork.description)||"<p>Описание пока не добавлено.</p>",seriesName=ser?pick(ser.title)||pick(ser.name)||ser.slug:"";app.innerHTML='<section class="wrap"><div class="visual"><div class="stage">'+(images[0]?'<img id="hero" class="hero" src="'+esc(imgUrl(images[0]))+'" alt="'+esc(pick(artwork.title))+'">':"")+(images.length>1?'<button id="prev" class="arrow prev">‹</button><button id="next" class="arrow next">›</button><span id="counter" class="counter">1 / '+images.length+'</span>':"")+'</div><div class="thumbs">'+images.map((im,i)=>'<button class="thumb '+(i===0?"active":"")+'" data-i="'+i+'"><img src="'+esc(thumbUrl(im))+'" alt=""></button>').join("")+'</div></div><article class="info"><h1 class="title">'+esc(pick(artwork.title)||"Без названия")+'</h1><div class="year">'+esc(artwork.year||"")+'</div><div class="status '+esc(artwork.commercialStatus||"available")+'">'+esc(cm.status)+'</div><div class="facts">'+(dims(artwork)?'<div>'+esc(dims(artwork))+'</div>':"")+(tech?'<div>'+esc(tech)+'</div>':"")+(materials?'<div>'+esc(materials)+'</div>':"")+(support?'<div>'+esc(support)+'</div>':"")+(seriesName?'<a class="series" href="../?page=traditional&series='+encodeURIComponent(ser.id)+'">'+esc(seriesName)+' ↗</a>':"")+'</div><div class="price">'+esc(money(artwork))+'</div><button id="buy" class="buy" '+(cm.disabled?"disabled":"")+'>'+esc(cm.label)+'</button><div class="note">'+esc(cm.note)+'</div><section class="description"><h2>'+(lang==="en"?"ABOUT THE ARTWORK":"О РАБОТЕ")+'</h2><div class="copy">'+description+'</div></section></article></section>';let idx=0,hero=document.querySelector("#hero"),counter=document.querySelector("#counter");function show(i){if(!images.length)return;idx=(i+images.length)%images.length;hero.src=imgUrl(images[idx]);if(counter)counter.textContent=(idx+1)+" / "+images.length;document.querySelectorAll(".thumb").forEach((x,j)=>x.classList.toggle("active",j===idx));notify()}document.querySelectorAll(".thumb").forEach(x=>x.onclick=()=>show(+x.dataset.i));document.querySelector("#prev")?.addEventListener("click",()=>show(idx-1));document.querySelector("#next")?.addEventListener("click",()=>show(idx+1));const buy=document.querySelector("#buy");if(buy&&!cm.disabled)buy.onclick=()=>{purchaseKind="original";requestForm();modal.classList.add("open")};notify()}catch(e){app.innerHTML='<div class="state">Не удалось загрузить данные работы.</div>';notify()}}
