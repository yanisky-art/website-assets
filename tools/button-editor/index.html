<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Button Creator</title><style>
*{box-sizing:border-box}body{margin:0;background:#191919;color:#eee;font:14px Arial,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:32px}.panel{border:1px solid #444;border-radius:14px;padding:24px;background:#202020}h1{font-size:22px;margin:0 0 8px}.muted{opacity:.65;margin:0 0 24px}.field{margin:16px 0}label{display:block;margin-bottom:7px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid #555;border-radius:8px;background:#171717;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{padding:10px 14px;border:1px solid #555;border-radius:8px;background:#292929;color:#fff;cursor:pointer}button.primary{background:#fff;color:#111}.result{display:none;margin-top:24px}.result.visible{display:block}.url{word-break:break-all;padding:10px;background:#151515;border-radius:8px}.preview{height:260px;margin-top:12px;border:1px solid #444;border-radius:10px;overflow:hidden}.preview iframe{width:100%;height:100%;border:0}.msg{margin-top:10px;opacity:.8}</style></head><body><div class="wrap"><div class="panel"><h1>Interactive Button</h1><p class="muted">Создай кликабельное изображение с анимацией при наведении.</p><div class="field"><label>Путь к изображению</label><input id="image" placeholder="assets/gif/kitty.gif"></div><div class="field"><label>Куда ведёт кнопка</label><input id="link" type="url" placeholder="https://..."></div><div class="actions"><button class="primary" id="create">Создать кнопку</button><button id="clear">Очистить</button></div><div class="result" id="result"><h3>Готовая ссылка</h3><div class="url" id="url"></div><div class="actions"><button id="copy">Скопировать ссылку</button><button id="save">Сохранить в My Widgets</button></div><div class="preview"><iframe id="preview"></iframe></div><div class="msg" id="msg"></div></div></div></div><script>
const KEY="myWebsiteWidgets";let current="";const $=id=>document.getElementById(id),clean=s=>s.trim().replace(/^\/+/, "");
function widgets(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function saveWidget(w){const a=widgets();a.push(w);localStorage.setItem(KEY,JSON.stringify(a))}
$("create").onclick=()=>{const image=clean($("image").value),link=$("link").value.trim();if(!image)return alert("Укажи путь к изображению.");if(!link)return alert("Укажи ссылку.");const u=new URL("../../button/",location.href);u.searchParams.set("image",image);u.searchParams.set("link",link);current=u.toString();$("url").textContent=current;$("preview").src=current;$("result").classList.add("visible")};
$("copy").onclick=async()=>{if(current){await navigator.clipboard.writeText(current);$("msg").textContent="Ссылка скопирована ✓"}};
$("save").onclick=()=>{if(!current)return;const image=clean($("image").value);saveWidget({type:"button",name:image.split("/").pop(),image,preview:image,url:current});$("msg").textContent="Кнопка сохранена в My Widgets ✓"};
$("clear").onclick=()=>{$("image").value="";$("link").value="";current="";$("result").classList.remove("visible");$("preview").src=""};
</script></body></html>
