<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook Viewer Creator</title><style>
*{box-sizing:border-box}body{margin:0;background:#191919;color:#eee;font:14px Arial,sans-serif}.wrap{max-width:820px;margin:0 auto;padding:32px}.panel{border:1px solid #444;border-radius:14px;padding:24px;background:#202020}h1{font-size:22px;margin:0 0 8px}.muted{opacity:.65;margin:0 0 24px}.field{margin:16px 0}label{display:block;margin-bottom:7px;font-weight:700}input{width:100%;padding:11px 12px;border:1px solid #555;border-radius:8px;background:#171717;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button{padding:10px 14px;border:1px solid #555;border-radius:8px;background:#292929;color:#fff;cursor:pointer}button.primary{background:#fff;color:#111}button:disabled{opacity:.35;cursor:default}.check,.result{display:none;margin-top:20px}.visible{display:block}.list{max-height:160px;overflow:auto;padding:10px;background:#151515;border-radius:8px}.url{word-break:break-all;padding:10px;background:#151515;border-radius:8px}.preview{height:360px;margin-top:12px;border:1px solid #444;border-radius:10px;overflow:hidden}.preview iframe{width:100%;height:100%;border:0}.msg{margin-top:10px;opacity:.8}</style></head><body><div class="wrap"><div class="panel"><h1>Notebook Viewer</h1><p class="muted">Укажи папку и префикс. _00 используется как обложка, страницы начинаются с _01.png.</p><div class="field"><label>Название блокнота</label><input id="name" placeholder="Green Sketchbook"></div><div class="field"><label>Папка</label><input id="folder" placeholder="assets/notebooks/green_sketchbook/"></div><div class="field"><label>Префикс файлов</label><input id="prefix" placeholder="green_sketchbook"></div><div class="actions"><button class="primary" id="check">Проверить страницы</button><button id="clear">Очистить</button></div><div class="check" id="checkResult"><h3 id="checkTitle">Проверка страниц</h3><div class="list" id="list"></div><p id="count"></p></div><div class="actions"><button class="primary" id="create" disabled>Создать блокнот</button></div><div class="result" id="result"><h3>Готовая ссылка</h3><div class="url" id="url"></div><div class="actions"><button id="copy">Скопировать ссылку</button><button id="save">Сохранить в My Widgets</button></div><div class="preview"><iframe id="preview"></iframe></div><div class="msg" id="msg"></div></div></div></div><script>
const KEY="myWebsiteWidgets",MAX=200,$=id=>document.getElementById(id);let pages=[],current="",cover="";
const clean=s=>s.trim().replace(/^\/+/, ""),folderNorm=s=>{s=clean(s);return s&& !s.endsWith("/")?s+"/":s},num=n=>String(n).padStart(2,"0");
function widgets(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function add(w){const a=widgets();a.push(w);localStorage.setItem(KEY,JSON.stringify(a))}
async function exists(path){try{const r=await fetch("../../"+path,{method:"HEAD",cache:"no-store"});return r.ok}catch(e){return false}}
$("check").onclick=async()=>{const folder=folderNorm($("folder").value),prefix=$("prefix").value.trim();if(!folder)return alert("Укажи папку блокнота.");if(!prefix)return alert("Укажи префикс.");pages=[];$("list").innerHTML="";$("checkResult").classList.add("visible");$("check").disabled=true;$("check").textContent="Проверяю...";cover=folder+prefix+"_00.png";for(let i=1;i<=MAX;i++){const file=prefix+"_"+num(i)+".png",path=folder+file;if(!(await exists(path))){$("list").insertAdjacentHTML("beforeend","<div>✕ "+file+" - не найден</div>");break}pages.push(path);$("list").insertAdjacentHTML("beforeend","<div>✓ "+file+"</div>")} $("count").textContent=pages.length?"Найдено страниц: "+pages.length:"Файл _01.png не найден.";$("create").disabled=!pages.length;$("check").disabled=false;$("check").textContent="Проверить страницы"};
$("create").onclick=()=>{if(!pages.length)return;const u=new URL("../../notebook/",location.href);u.searchParams.set("pages",pages.join(","));current=u.toString();$("url").textContent=current;$("preview").src=current;$("result").classList.add("visible")};
$("copy").onclick=async()=>{if(current){await navigator.clipboard.writeText(current);$("msg").textContent="Ссылка скопирована ✓"}};
$("save").onclick=()=>{if(!current)return;const folder=folderNorm($("folder").value),prefix=$("prefix").value.trim(),name=$("name").value.trim()||prefix;add({type:"notebook",name,folder,prefix,cover,preview:cover,url:current,pages:[...pages]});$("msg").textContent="Блокнот сохранён в My Widgets ✓"};
$("clear").onclick=()=>{$("name").value=$("folder").value=$("prefix").value="";pages=[];current="";$("checkResult").classList.remove("visible");$("result").classList.remove("visible");$("create").disabled=true;$("preview").src=""};
</script></body></html>
