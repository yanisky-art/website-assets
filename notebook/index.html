<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notebook Viewer</title>


  <style>

    * {
      box-sizing: border-box;
    }


    /* ===================================== */
    /* PAGE                                  */
    /* ===================================== */

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      overflow: hidden;
    }


    @media (prefers-color-scheme: dark) {

      html,
      body {
        background: #191919;
      }

    }


    body {
      font-family: Arial, sans-serif;
    }


    /* ===================================== */
    /* NOTEBOOK                              */
    /* ===================================== */

    .notebook {

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      padding: 2px;

    }


    /* ===================================== */
    /* IMAGE AREA                            */
    /* ===================================== */

    .page-area {

      display: flex;

      align-items: center;
      justify-content: center;

      width: 100%;

      /*
        Практически вся высота виджета
        отдаётся изображению.

        Оставляем только 28px
        для навигации снизу.
      */

      height: calc(100% - 28px);

      min-height: 0;

    }


    #page-image {

      display: block;

      /*
        Изображение увеличивается настолько,
        насколько позволяет сам виджет,
        но не обрезается.
      */

      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;

    }


    /* ===================================== */
    /* NAVIGATION                            */
    /* ===================================== */

    .navigation {

      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: nowrap;

      gap: 4px;

      height: 24px;

      margin-top: 2px;

      flex-shrink: 0;

    }


    .page-numbers {

      display: flex;

      justify-content: center;
      align-items: center;

      flex-wrap: nowrap;

      gap: 2px;

    }


    /* ===================================== */
    /* PAGE NUMBERS                          */
    /* ===================================== */

    .page-number {

      appearance: none;

      border: 0;

      background: transparent;

      padding: 2px 5px;

      font: inherit;
      font-size: 14px;

      color: #222222;

      cursor: pointer;

      opacity: 1;

      transition:
        opacity 0.15s ease,
        transform 0.15s ease;

    }


    .page-number:hover {
      transform: scale(1.15);
    }


    /*
      Текущая страница
      становится полупрозрачной.
    */

    .page-number.active {
      opacity: 0.5;
    }


    /* ===================================== */
    /* ARROWS                                */
    /* ===================================== */

    .arrow {

      appearance: none;

      border: 0;

      background: transparent;

      padding: 2px 6px;

      font-size: 17px;

      color: #222222;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;

    }


    .arrow:hover:not(:disabled) {
      transform: scale(1.2);
    }


    .arrow:disabled {
      opacity: 0.2;
      cursor: default;
    }


    /* ===================================== */
    /* DARK MODE                             */
    /* ===================================== */

    @media (prefers-color-scheme: dark) {

      .page-number,
      .arrow {
        color: #ffffff;
      }

    }

  
    /* YANISKY ADAPTIVE SCROLLBARS */
    :root{color-scheme:light dark}
    html,body,*{scrollbar-color:#b8b8b8 #f3f3f3;scrollbar-width:thin}
    *::-webkit-scrollbar{width:10px;height:10px}
    *::-webkit-scrollbar-track{background:#f3f3f3}
    *::-webkit-scrollbar-thumb{background:#b8b8b8;border:2px solid #f3f3f3;border-radius:999px}
    *::-webkit-scrollbar-thumb:hover{background:#969696}
    *::-webkit-scrollbar-corner{background:#f3f3f3}
    @media(prefers-color-scheme:dark){
      html,body,*{scrollbar-color:#686868 #191919}
      *::-webkit-scrollbar-track{background:#191919}
      *::-webkit-scrollbar-thumb{background:#686868;border-color:#191919}
      *::-webkit-scrollbar-thumb:hover{background:#858585}
      *::-webkit-scrollbar-corner{background:#191919}
    }

  </style>

</head>


<body>


  <div class="notebook">


    <!-- IMAGE -->

    <div class="page-area">

      <img
        id="page-image"
        alt="Notebook page"
      >

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">


      <button
        class="arrow"
        id="previous-page"
        aria-label="Предыдущая страница"
      >
        ◀
      </button>


      <div
        class="page-numbers"
        id="page-numbers"
      ></div>


      <button
        class="arrow"
        id="next-page"
        aria-label="Следующая страница"
      >
        ➤
      </button>


    </div>


  </div>


  <script>

    /* ===================================== */
    /* READ URL                              */
    /* ===================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const pagesParameter =
      params.get("pages");


    let pages = [];


    if (pagesParameter) {

      pages =
        pagesParameter
          .split(",")
          .map(
            page => page.trim()
          )
          .filter(
            page => page !== ""
          );

    }


    /* ===================================== */
    /* IGNORE _00                            */
    /* ===================================== */

    /*
      _00 всегда является обложкой.

      Она никогда не должна появляться
      среди страниц блокнота.
    */

    pages =
      pages.filter(
        page =>
          !/_00\.[^.]+$/i.test(page)
      );


    /* ===================================== */
    /* ELEMENTS                              */
    /* ===================================== */

    const pageImage =
      document.getElementById(
        "page-image"
      );


    const pageNumbers =
      document.getElementById(
        "page-numbers"
      );


    const previousButton =
      document.getElementById(
        "previous-page"
      );


    const nextButton =
      document.getElementById(
        "next-page"
      );


    const navigation =
      document.querySelector(
        ".navigation"
      );


    let currentPage = 0;


    /* ===================================== */
    /* SHOW PAGE                             */
    /* ===================================== */

    function showPage(index) {

      if (
        index < 0 ||
        index >= pages.length
      ) {
        return;
      }


      currentPage =
        index;


      pageImage.src =
        "../" + pages[index];


      updateNavigation();

    }


    /* ===================================== */
    /* CREATE NUMBERS                        */
    /* ===================================== */

    function createPageNumbers() {

      pageNumbers.innerHTML =
        "";


      pages.forEach(
        function (
          page,
          index
        ) {

          const button =
            document.createElement(
              "button"
            );


          button.className =
            "page-number";


          /*
            Первый файл _01
            отображается как страница 1.
          */

          button.textContent =
            index + 1;


          button.addEventListener(
            "click",
            function () {

              showPage(
                index
              );

            }
          );


          pageNumbers.appendChild(
            button
          );

        }
      );

    }


    /* ===================================== */
    /* UPDATE NAVIGATION                     */
    /* ===================================== */

    function updateNavigation() {

      const numberButtons =
        document.querySelectorAll(
          ".page-number"
        );


      numberButtons.forEach(
        function (
          button,
          index
        ) {

          button.classList.toggle(
            "active",
            index === currentPage
          );

        }
      );


      /*
        Левая стрелка выключена
        на первой странице.
      */

      previousButton.disabled =
        currentPage === 0;


      /*
        Правая стрелка выключена
        на последней странице.
      */

      nextButton.disabled =
        currentPage ===
        pages.length - 1;

    }


    /* ===================================== */
    /* PREVIOUS                              */
    /* ===================================== */

    previousButton.addEventListener(
      "click",
      function () {

        showPage(
          currentPage - 1
        );

      }
    );


    /* ===================================== */
    /* NEXT                                  */
    /* ===================================== */

    nextButton.addEventListener(
      "click",
      function () {

        showPage(
          currentPage + 1
        );

      }
    );


    /* ===================================== */
    /* START                                 */
    /* ===================================== */

    if (
      pages.length > 0
    ) {

      createPageNumbers();

      showPage(0);

    }
    else {

      navigation.style.display =
        "none";


      pageImage.style.display =
        "none";

    }

  </script>


</body>

</html>
