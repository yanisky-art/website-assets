<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#171717;font-family:Arial,sans-serif}.gallery{column-count:3;column-gap:24px}.card{break-inside:avoid;margin:0 0 34px;display:block;color:inherit;text-decoration:none}.image-wrap{position:relative;overflow:hidden;background:#f4f4f4}.art{width:100%;height:auto;display:block;transform-origin:center;transition:transform .35s cubic-bezier(.2,.7,.2,1),filter .25s ease}.card:hover .art{transform:scale(1.018) rotate(.12deg)}.status{position:absolute;top:10px;left:10px;padding:6px 8px;border-radius:999px;background:rgba(20,20,20,.82);color:#fff;font-size:10px;line-height:1;letter-spacing:.04em;text-transform:uppercase;backdrop-filter:blur(5px)}.status.available{display:none}.meta{padding-top:11px}.title{font-size:14px;font-weight:600;line-height:1.35}.sub{margin-top:5px;font-size:12px;opacity:.64;display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}.price{opacity:1;font-weight:600}.sold-price{text-decoration:line-through;opacity:.55}.empty{padding:40px 0;text-align:center;opacity:.55}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 24px}.filter{border:1px solid #ccc;background:transparent;color:inherit;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:12px;transition:background .18s ease,color .18s ease,border-color .18s ease}.filter:hover{border-color:#777}.filter.active{background:#171717;color:#fff;border-color:#171717}.pager{display:flex;justify-content:center;gap:6px;align-items:center;margin:22px 0 4px}.pager button{border:1px solid #ccc;background:transparent;color:inherit;border-radius:7px;min-width:34px;height:34px;cursor:pointer}.pager button.active{background:#171717;color:#fff;border-color:#171717}.pager button:disabled{opacity:.3;cursor:default}@media(max-width:980px){.gallery{column-count:3;column-gap:16px}.card{margin-bottom:25px}}@media(max-width:640px){.gallery{column-count:2;column-gap:12px}.card{margin-bottom:20px}.meta{padding-top:8px}.title{font-size:13px}.sub{font-size:11px}.filters{margin-bottom:18px}}@media(prefers-color-scheme:dark){html,body{color:#f5f5f5}.image-wrap{background:#242424}.filter,.pager button{border-color:#555}.filter:hover{border-color:#999}.filter.active,.pager button.active{background:#f5f5f5;color:#171717;border-color:#f5f5f5}}
</style></head><body><main id="root"><div class="empty">Загрузка галереи…</div></main><script>
const q=new URLSearchParams(location.search),pageSize=Math.max(3,Math.min(60,Number(q.get("pageSize"))||18)),sourceType=q.get("sourceType")||"all",sourceId=q.get("sourceId")||"",sort=q.get("sort")||"newest",pinned=(q.get("pinned")||"").split(",").filter(Boolean),manualOrder=(q.get("order")||"").split(",").filter(Boolean),quickFilters=(q.get("quickFilters")||"").split(",").filter(Boolean);let activeFilter="",page=Math.max(1,Number(q.get("page"))||1);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dims(a){const d=a.dimensions||{};return d.width&&d.height?d.width+" × "+d.height+(d.unit||" cm"):""}
function price(a){const p=Number(a.originalPriceUsd);return p>0?"$"+Math.round(p).toLocaleString("en-US"):""}function statusText(s){return({available:"В наличии",reserved:"Зарезервировано",sold:"Продано"})[s]||""}function matches(a){if(sourceType==="all")return true;if(sourceType==="category")return a.category===sourceId;if(sourceType==="series")return a.seriesId===sourceId;if(sourceType==="tag")return (a.tagIds||[]).includes(sourceId);return true}function sortItems(items){const rank=new Map(manualOrder.map((id,i)=>[id,i])),pin=new Map(pinned.map((id,i)=>[id,i]));const copy=[...items];copy.sort((a,b)=>{const ap=pin.has(a.id),bp=pin.has(b.id);if(ap!==bp)return ap?-1:1;if(ap&&bp)return pin.get(a.id)-pin.get(b.id);const am=rank.has(a.id),bm=rank.has(b.id);if(am!==bm)return am?-1:1;if(am&&bm)return rank.get(a.id)-rank.get(b.id);return 0});if(pinned.length||manualOrder.length)return copy;if(sort==="oldest")copy.sort((a,b)=>String(a.publishedAt||"").localeCompare(String(b.publishedAt||"")));else if(sort==="price-asc")copy.sort((a,b)=>(Number(a.originalPriceUsd)||Infinity)-(Number(b.originalPriceUsd)||Infinity));else if(sort==="price-desc")copy.sort((a,b)=>(Number(b.originalPriceUsd)||-1)-(Number(a.originalPriceUsd)||-1));else if(sort==="title")copy.sort((a,b)=>String(a.title?.ru||a.title?.en||"").localeCompare(String(b.title?.ru||b.title?.en||""),"ru"));else copy.sort((a,b)=>String(b.publishedAt||"").localeCompare(String(a.publishedAt||"")));return copy}
function notify(){parent.postMessage({type:"yanisky-widget-size",height:document.documentElement.scrollHeight},"*")}
async function render(){const root=document.querySelector("#root");try{const [ar,gr]=await Promise.all([fetch("../public-data/artworks.json",{cache:"no-store"}),fetch("../public-data/gallery.json",{cache:"no-store"})]);if(!ar.ok||!gr.ok)throw new Error();const artworks=await ar.json(),gallery=await gr.json(),allowed=new Set(gallery.artworkIds||[]);let items=artworks.filter(a=>allowed.has(a.id)&&a.commercialStatus!=="in_progress"&&matches(a));if(activeFilter)items=items.filter(a=>(a.tagIds||[]).includes(activeFilter));items=sortItems(items);const pages=Math.max(1,Math.ceil(items.length/pageSize));page=Math.min(page,pages);const shown=items.slice((page-1)*pageSize,page*pageSize);if(!shown.length){root.innerHTML='<div class="empty">Опубликованных работ пока нет.</div>';notify();return}root.textContent="";if(quickFilters.length){const dictRes=await fetch("../public-data/dictionaries.json",{cache:"no-store"}),dict=dictRes.ok?await dictRes.json():[],tags=dict.filter(x=>x.dictionary_type==="tag"&&quickFilters.includes(x.id)),bar=document.createElement("div");bar.className="filters";const all=document.createElement("button");all.className="filter"+(!activeFilter?" active":"");all.textContent="Все";all.onclick=()=>{activeFilter="";page=1;render()};bar.append(all);tags.forEach(t=>{const b=document.createElement("button");b.className="filter"+(activeFilter===t.id?" active":"");b.textContent=t.labels?.ru||t.labels?.en||t.key;b.onclick=()=>{activeFilter=t.id;page=1;render()};bar.append(b)});root.append(bar)}const galleryEl=document.createElement("section");galleryEl.className="gallery";for(const a of shown){const im=(a.images||[]).find(x=>x.isMain)||(a.images||[])[0];if(!im?.thumbnailUrl&&!im?.webUrl)continue;const card=document.createElement("a");card.className="card";card.href="../artwork/?slug="+encodeURIComponent(a.slug||a.id);const st=a.commercialStatus||"available",p=price(a);card.innerHTML='<div class="image-wrap"><img class="art" loading="lazy" decoding="async" src="'+esc(im.thumbnailUrl||im.webUrl)+'" alt="'+esc(a.title?.ru||a.title?.en||"")+'">'+(statusText(st)?'<span class="status '+esc(st)+'">'+esc(statusText(st))+'</span>':"")+'</div><div class="meta"><div class="title">'+esc(a.title?.ru||a.title?.en||"Без названия")+'</div><div class="sub">'+(dims(a)?'<span>'+esc(dims(a))+'</span>':"")+(p?'<span class="price '+(st==="sold"?"sold-price":"")+'">'+esc(p)+'</span>':"")+'</div></div>';galleryEl.append(card)}root.append(galleryEl);if(pages>1){const nav=document.createElement("nav");nav.className="pager";const add=(label,p,disabled=false,active=false)=>{const b=document.createElement("button");b.textContent=label;b.disabled=disabled;b.classList.toggle("active",active);b.onclick=()=>{page=p;render()};nav.append(b)};add("‹",Math.max(1,page-1),page===1);for(let i=1;i<=pages;i++)add(String(i),i,false,i===page);add("›",Math.min(pages,page+1),page===pages);root.append(nav)}requestAnimationFrame(notify)}catch(e){root.innerHTML='<div class="empty">Не удалось загрузить галерею.</div>';notify()}}
render();new ResizeObserver(notify).observe(document.body);
</script></body></html>
