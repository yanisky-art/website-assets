<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#171717;font-family:Arial,sans-serif}.gallery{column-count:3;column-gap:22px}.card{break-inside:avoid;margin:0 0 28px;display:block;color:inherit;text-decoration:none}.art{width:100%;height:auto;display:block;transition:transform .25s ease}.card:hover .art{transform:scale(1.012) rotate(.15deg)}.meta{padding-top:9px}.title{font-size:14px;font-weight:600;line-height:1.3}.sub{margin-top:4px;font-size:12px;opacity:.62;display:flex;gap:8px;flex-wrap:wrap}.empty{padding:40px 0;text-align:center;opacity:.55}.pager{display:flex;justify-content:center;gap:6px;align-items:center;margin:18px 0 4px}.pager button{border:1px solid #ccc;background:transparent;color:inherit;border-radius:7px;min-width:34px;height:34px;cursor:pointer}.pager button.active{background:#171717;color:#fff;border-color:#171717}.pager button:disabled{opacity:.3;cursor:default}@media(max-width:760px){.gallery{column-count:2;column-gap:12px}.card{margin-bottom:18px}}@media(prefers-color-scheme:dark){html,body{color:#f5f5f5}.pager button{border-color:#555}.pager button.active{background:#f5f5f5;color:#171717;border-color:#f5f5f5}}
</style></head><body><main id="root"><div class="empty">Загрузка галереи…</div></main><script>
const q=new URLSearchParams(location.search),pageSize=Math.max(3,Math.min(60,Number(q.get("pageSize"))||18)),sourceType=q.get("sourceType")||"all",sourceId=q.get("sourceId")||"",sort=q.get("sort")||"newest",showFilters=q.get("filters")!=="0";let page=Math.max(1,Number(q.get("page"))||1);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dims(a){const d=a.dimensions||{};return d.width&&d.height?d.width+" × "+d.height+(d.unit||" cm"):""}
function price(a){const p=Number(a.originalPriceUsd);return p>0?"$"+Math.round(p).toLocaleString("en-US"):""}function matches(a){if(sourceType==="all")return true;if(sourceType==="category")return a.category===sourceId;if(sourceType==="series")return a.seriesId===sourceId;if(sourceType==="tag")return (a.tagIds||[]).includes(sourceId);return true}function sortItems(items){const copy=[...items];if(sort==="oldest")copy.sort((a,b)=>String(a.publishedAt||"").localeCompare(String(b.publishedAt||"")));else if(sort==="price-asc")copy.sort((a,b)=>(Number(a.originalPriceUsd)||Infinity)-(Number(b.originalPriceUsd)||Infinity));else if(sort==="price-desc")copy.sort((a,b)=>(Number(b.originalPriceUsd)||-1)-(Number(a.originalPriceUsd)||-1));else if(sort==="title")copy.sort((a,b)=>String(a.title?.ru||a.title?.en||"").localeCompare(String(b.title?.ru||b.title?.en||""),"ru"));else copy.sort((a,b)=>String(b.publishedAt||"").localeCompare(String(a.publishedAt||"")));return copy}
function notify(){parent.postMessage({type:"yanisky-widget-size",height:document.documentElement.scrollHeight},"*")}
async function render(){const root=document.querySelector("#root");try{const [ar,gr]=await Promise.all([fetch("../public-data/artworks.json",{cache:"no-store"}),fetch("../public-data/gallery.json",{cache:"no-store"})]);if(!ar.ok||!gr.ok)throw new Error();const artworks=await ar.json(),gallery=await gr.json(),allowed=new Set(gallery.artworkIds||[]);let items=artworks.filter(a=>allowed.has(a.id)&&a.commercialStatus!=="in_progress"&&matches(a));items=sortItems(items);const pages=Math.max(1,Math.ceil(items.length/pageSize));page=Math.min(page,pages);const shown=items.slice((page-1)*pageSize,page*pageSize);if(!shown.length){root.innerHTML='<div class="empty">Опубликованных работ пока нет.</div>';notify();return}const galleryEl=document.createElement("section");galleryEl.className="gallery";for(const a of shown){const im=(a.images||[]).find(x=>x.isMain)||(a.images||[])[0];if(!im?.thumbnailUrl&&!im?.webUrl)continue;const card=document.createElement("a");card.className="card";card.href="../artwork/?slug="+encodeURIComponent(a.slug||a.id);card.innerHTML='<img class="art" loading="lazy" decoding="async" src="'+esc(im.thumbnailUrl||im.webUrl)+'" alt="'+esc(a.title?.ru||a.title?.en||"")+'"><div class="meta"><div class="title">'+esc(a.title?.ru||a.title?.en||"Без названия")+'</div><div class="sub">'+(dims(a)?'<span>'+esc(dims(a))+'</span>':"")+(price(a)?'<span>'+esc(price(a))+'</span>':"")+'</div></div>';galleryEl.append(card)}root.textContent="";root.append(galleryEl);if(pages>1){const nav=document.createElement("nav");nav.className="pager";const add=(label,p,disabled=false,active=false)=>{const b=document.createElement("button");b.textContent=label;b.disabled=disabled;b.classList.toggle("active",active);b.onclick=()=>{page=p;render()};nav.append(b)};add("‹",Math.max(1,page-1),page===1);for(let i=1;i<=pages;i++)add(String(i),i,false,i===page);add("›",Math.min(pages,page+1),page===pages);root.append(nav)}requestAnimationFrame(notify)}catch(e){root.innerHTML='<div class="empty">Не удалось загрузить галерею.</div>';notify()}}
render();new ResizeObserver(notify).observe(document.body);
</script></body></html>
