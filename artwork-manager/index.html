<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YANISKY · Artwork Manager</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111113;color:#f4f1f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#26202d 0,#151317 38%,#0d0d0f 100%);display:grid;place-items:center}
.card{width:min(440px,calc(100vw - 32px));padding:42px;border:1px solid #353039;border-radius:22px;background:rgba(22,20,24,.94);box-shadow:0 24px 80px #0008;text-align:center}
.brand{font-size:13px;letter-spacing:.32em;color:#bca9cf;margin-bottom:28px}.mark{font-size:38px;margin:0 0 10px}.sub{color:#aaa1ae;line-height:1.55;margin:0 0 28px}
button{width:100%;border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:650;cursor:pointer;background:#eee8f4;color:#171219}
button:hover{filter:brightness(1.06)}button:disabled{opacity:.55;cursor:wait}.status{font-size:13px;color:#9c929f;margin-top:18px;min-height:20px}.error{color:#e5a2ad}
.small{font-size:12px;color:#756e78;margin-top:22px}
</style>
</head>
<body>
<main class="card">
<div class="brand">YANISKY</div>
<h1 class="mark">Artwork Manager</h1>
<p class="sub">Закрытая административная зона для управления работами, сериями и публикациями.</p>
<button id="login" type="button">Войти через GitHub</button>
<div id="status" class="status">Доступ только для администратора.</div>
<div class="small">Авторизация защищена Supabase Auth.</div>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://jzjpmmtrfrrnzbyrvuof.supabase.co";
const SUPABASE_KEY="sb_publishable_29YTJk5mQNlzh7F2w2jBfA_X9BYGzYQ";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const login=document.querySelector("#login");
const status=document.querySelector("#status");
function setStatus(message,error=false){status.textContent=message;status.classList.toggle("error",error)}
async function checkAccess(){
 const {data:{session}}=await supabase.auth.getSession();
 if(!session)return;
 login.disabled=true; setStatus("Проверяю доступ…");
 const {data,error}=await supabase.from("admin_users").select("user_id").eq("user_id",session.user.id).maybeSingle();
 if(error){setStatus("Не удалось проверить права доступа.",true);login.disabled=false;return}
 if(data){setStatus("Доступ подтверждён. Интерфейс Artwork Manager будет подключён следующим этапом.");login.textContent="Вход выполнен";return}
 setStatus("GitHub-вход выполнен. Аккаунт ожидает назначения администратором.");
 login.textContent="Выйти";
 login.disabled=false;
 login.onclick=async()=>{await supabase.auth.signOut();location.reload()};
}
login.addEventListener("click",async()=>{
 login.disabled=true;setStatus("Перенаправляю в GitHub…");
 const {error}=await supabase.auth.signInWithOAuth({provider:"github",options:{redirectTo:location.origin+location.pathname}});
 if(error){setStatus("Ошибка входа: "+error.message,true);login.disabled=false}
});
await checkAccess();
</script>
</body>
</html>
