<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YANISKY Page Builder</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;

      background: #ffffff;
      color: #222222;

      font-family: Arial, sans-serif;
    }

    body {
      padding: 40px 20px 70px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .subtitle {
      margin: 0 0 30px;
      opacity: 0.6;
      line-height: 1.5;
    }


    /* ===================================== */
    /* TABS                                  */
    /* ===================================== */

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 25px;

      border-bottom: 1px solid #dddddd;
    }

    .tab-button {
      appearance: none;

      margin-bottom: -1px;
      padding: 12px 16px;

      border: 0;
      border-bottom: 2px solid transparent;

      background: transparent;
      color: inherit;

      font: inherit;
      font-weight: 600;

      cursor: pointer;

      opacity: 0.45;

      transition:
        opacity 0.15s ease,
        border-color 0.15s ease;
    }

    .tab-button:hover {
      opacity: 0.8;
    }

    .tab-button.active {
      opacity: 1;
      border-bottom-color: currentColor;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }


    /* ===================================== */
    /* TOOL PANEL                            */
    /* ===================================== */

    .tool-panel {
      padding: 25px;

      border: 1px solid #dddddd;
      border-radius: 14px;
    }

    .description {
      margin: 0 0 25px;
      opacity: 0.6;
      line-height: 1.5;
    }


    /* ===================================== */
    /* EDIT MODE                             */
    /* ===================================== */

    .edit-mode {
      display: none;

      margin-bottom: 22px;
      padding: 12px 14px;

      border: 1px solid #dddddd;
      border-radius: 9px;

      font-size: 13px;
      line-height: 1.5;
    }

    .edit-mode.visible {
      display: block;
    }

    .edit-mode strong {
      font-weight: 600;
    }


    /* ===================================== */
    /* FORM                                  */
    /* ===================================== */

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 11px 12px;

      border: 1px solid #cccccc;
      border-radius: 8px;

      background: transparent;
      color: inherit;

      font: inherit;
    }

    input:focus {
      outline: 2px solid currentColor;
      outline-offset: 1px;
    }

    .hint {
      margin-top: 6px;

      font-size: 12px;
      line-height: 1.5;

      opacity: 0.5;
    }


    /* ===================================== */
    /* ACTION BUTTONS                        */
    /* ===================================== */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 22px;
    }

    .action-button {
      appearance: none;

      padding: 10px 14px;

      border: 1px solid #aaaaaa;
      border-radius: 8px;

      background: transparent;
      color: inherit;

      font: inherit;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .action-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .action-button.primary {
      background: #222222;
      color: #ffffff;
      border-color: #222222;
    }

    .action-button:disabled {
      opacity: 0.3;
      cursor: default;
    }


    /* ===================================== */
    /* RESULTS                               */
    /* ===================================== */

    .result-area {
      display: none;

      margin-top: 30px;
      padding-top: 25px;

      border-top: 1px solid #dddddd;
    }

    .result-area.visible {
      display: block;
    }

    .result-title {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .result-url {
      width: 100%;

      padding: 12px;

      border: 1px solid #cccccc;
      border-radius: 8px;

      overflow-wrap: anywhere;

      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .preview-title {
      margin-top: 25px;
      margin-bottom: 10px;

      font-size: 14px;
      font-weight: 600;
    }

    .preview-frame {
      width: 100%;
      height: 380px;

      border: 1px solid #dddddd;
      border-radius: 10px;

      overflow: hidden;
    }

    .preview-frame iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;
    }


    /* ===================================== */
    /* PAGE CHECKER                          */
    /* ===================================== */

    .page-check-result {
      display: none;

      margin-top: 22px;
      padding: 16px;

      border: 1px solid #dddddd;
      border-radius: 10px;
    }

    .page-check-result.visible {
      display: block;
    }

    .page-check-title {
      margin-bottom: 12px;
      font-weight: 600;
    }

    .page-check-list {
      display: flex;
      flex-direction: column;
      gap: 7px;

      font-family: monospace;
      font-size: 13px;
    }

    .page-found {
      line-height: 1.5;
    }

    .page-missing {
      margin-top: 3px;

      opacity: 0.45;
      line-height: 1.5;
    }

    .page-count {
      margin-top: 15px;
      padding-top: 12px;

      border-top: 1px solid #dddddd;

      font-weight: 600;
    }


    /* ===================================== */
    /* MESSAGES                              */
    /* ===================================== */

    .message {
      display: none;

      margin-top: 12px;

      font-size: 13px;
    }

    .message.visible {
      display: block;
    }


    /* ===================================== */
    /* MY WIDGETS                            */
    /* ===================================== */

    .library {
      margin-top: 50px;
      padding-top: 30px;

      border-top: 1px solid #dddddd;
    }

    .library h2 {
      margin-bottom: 18px;
    }

    .widget-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .widget-item {
      position: relative;
      width: 105px;
    }

    .widget-preview {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 105px;
      height: 105px;

      border: 1px solid #dddddd;
      border-radius: 12px;

      overflow: hidden;

      background: transparent;
      text-decoration: none;

      transition:
        transform 0.15s ease;
    }

    .widget-preview:hover {
      transform: translateY(-2px);
    }

    .widget-preview img {
      display: block;

      max-width: 88%;
      max-height: 88%;

      width: auto;
      height: auto;

      object-fit: contain;
    }

    .widget-placeholder {
      font-size: 38px;
      opacity: 0.55;
    }

    .widget-name {
      margin-top: 7px;

      overflow: hidden;

      text-align: center;

      font-size: 11px;

      white-space: nowrap;
      text-overflow: ellipsis;

      opacity: 0.55;
    }


    /* ===================================== */
    /* EDIT SAVED WIDGET                     */
    /* ===================================== */

    .edit-widget {
      display: block;

      width: 100%;

      margin-top: 5px;
      padding: 3px 4px;

      border: 0;

      background: transparent;
      color: inherit;

      font: inherit;
      font-size: 11px;

      cursor: pointer;

      opacity: 0.45;

      transition:
        opacity 0.15s ease;
    }

    .edit-widget:hover {
      opacity: 1;
    }


    /* ===================================== */
    /* DELETE WIDGET                         */
    /* ===================================== */

    .delete-widget {
      position: absolute;

      top: -7px;
      right: -7px;

      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 24px;
      height: 24px;

      padding: 0;

      border: 1px solid #cccccc;
      border-radius: 50%;

      background: #ffffff;
      color: #222222;

      font-family: Arial, sans-serif;
      font-size: 17px;
      line-height: 1;

      cursor: pointer;

      opacity: 0;

      transform: scale(0.85);

      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .widget-item:hover .delete-widget,
    .delete-widget:focus {
      opacity: 1;
      transform: scale(1);
    }

    .delete-widget:hover {
      transform: scale(1.12);
    }


    /* ===================================== */
    /* DARK MODE                             */
    /* ===================================== */

    @media (prefers-color-scheme: dark) {
      .builder-layers{background:#191919;color:#fff}.builder-layer{color:#fff}.builder-layer:hover{background:#262626}.builder-layer.selected{background:#303030!important;border-color:#666!important;color:#fff!important}.builder-layer.hidden-layer{color:#fff}.builder-layer-icon,.builder-layer-action,.builder-layer-name{color:#fff}.builder-layer-name[contenteditable="true"]{background:#111;color:#fff}.builder-layer-folder-children{border-color:#444}.builder-layers-head{color:#fff}.builder-layers-head .builder-mini{color:#fff;border-color:#666;background:#191919}

      html,
      body {
        background: #191919;
        color: #ffffff;
      }

      .tabs,
      .library,
      .result-area {
        border-color: #444444;
      }

      .tool-panel,
      .preview-frame,
      .widget-preview,
      .page-check-result,
      .edit-mode {
        border-color: #444444;
      }

      .page-count {
        border-color: #444444;
      }

      input,
      .result-url {
        border-color: #555555;
      }

      .action-button {
        border-color: #666666;
      }

      .action-button.primary {
        background: #ffffff;
        color: #191919;
        border-color: #ffffff;
      }

      .delete-widget {
        background: #292929;
        color: #ffffff;
        border-color: #555555;
      }

    }


    /* ===================================== */
    /* TOUCH                                 */
    /* ===================================== */

    @media (hover: none) {

      .delete-widget {
        opacity: 0.7;
        transform: scale(1);
      }

    }


    /* ===================================== */
    /* MOBILE                                */
    /* ===================================== */

    @media (max-width: 600px) {

      body {
        padding: 25px 14px 50px;
      }

      .tool-panel {
        padding: 18px;
      }

      .preview-frame {
        height: 300px;
      }

    }

    /* ===================================== */
    /* PAGE BUILDER                          */
    /* ===================================== */
    #page-builder-tool.active{display:block}
    .builder-shell{display:grid;grid-template-columns:180px 210px minmax(360px,1fr) 230px;min-height:720px;border:1px solid #ddd;border-radius:14px;overflow:hidden;background:#fff}
    .builder-panel{padding:16px;border-right:1px solid #ddd;min-width:0}
    .builder-panel:last-child{border-right:0;border-left:1px solid #ddd}
    .builder-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin:0 0 12px}
    .builder-layers-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.builder-layer-add-folder{padding:5px 7px;font-size:10px}
    .builder-layers{display:flex;flex-direction:column;gap:3px;max-height:42vh;overflow:auto;padding-right:2px}
    .builder-layer{display:grid;grid-template-columns:18px 18px minmax(0,1fr) 18px 22px;gap:4px;align-items:center;min-height:30px;padding:3px 5px;border:1px solid transparent;border-radius:6px;font-size:11px;cursor:pointer}
    .builder-layer:hover{background:#2a2a2a;color:#fff}.builder-layer.selected{background:#353535!important;border-color:#555!important;color:#fff!important}.builder-layer.hidden-layer{opacity:.48}.builder-layer.locked-layer .builder-layer-name{opacity:.65}
    .builder-layer-icon,.builder-layer-action{appearance:none;border:0;background:transparent;color:inherit;padding:0;width:18px;height:18px;display:grid;place-items:center;font:inherit;font-size:11px;cursor:pointer;border-radius:4px}
    .builder-layer-action:hover{background:rgba(127,127,127,.18)}.builder-layer-delete{font-size:16px;font-weight:700;width:22px;height:22px;margin-left:0;grid-column:5;justify-self:end}.builder-layer-delete:hover{background:rgba(255,90,90,.2);color:#ff8d8d}.builder-layer-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.builder-layer-name[contenteditable="true"]{outline:1px solid #777;background:#242424;color:#fff;padding:2px 3px;border-radius:3px;cursor:text}
    .builder-layer-folder{font-weight:700}.builder-layer-folder-children{padding-left:14px;border-left:1px solid #ddd;margin-left:8px}.builder-layer-drop{height:4px;border-radius:4px}.builder-layer-drop.drag-over{height:10px;background:#6f8cff55}
    .builder-layer-menu{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0 10px}.builder-layer-menu .builder-mini{padding:5px 7px;font-size:10px}
    .builder-opacity-row{display:grid;grid-template-columns:1fr 48px;gap:7px;align-items:center}.builder-opacity-row input[type="range"]{width:100%}
    .page-block.builder-hidden{display:none!important}.page-block.builder-locked{cursor:not-allowed}.page-block.builder-locked .builder-resize-handle,.page-block.builder-locked .page-block-tools{display:none!important}
    .builder-pages,.builder-blocks{display:flex;flex-direction:column;gap:7px}
    .builder-page,.builder-block{appearance:none;width:100%;border:1px solid transparent;border-radius:8px;background:transparent;color:inherit;text-align:left;padding:9px 10px;font:inherit;font-size:13px;cursor:pointer}
    .builder-page:hover,.builder-block:hover{background:#f5f5f5}.builder-page.active{background:#eee;font-weight:700}
    .builder-block{border-color:#ddd;background:#fafafa}.builder-block small{display:block;opacity:.5;margin-top:3px}.builder-block[draggable="true"]{cursor:grab}.builder-block[draggable="true"]:active{cursor:grabbing;opacity:.7}.builder-block.drag-source{outline:2px solid #6f8cff;outline-offset:2px}
    .builder-main{min-width:0;background:#f5f5f5;display:flex;flex-direction:column}
    .builder-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff;flex-wrap:wrap}
    .builder-toolbar-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .builder-mini{appearance:none;border:1px solid #ccc;border-radius:7px;background:transparent;color:inherit;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}
    .builder-mini.active{background:#222;color:#fff;border-color:#222}.builder-mini:disabled{opacity:.3;cursor:not-allowed}.builder-draft-status{font-size:11px;opacity:.55;white-space:nowrap}.builder-draft-status.dirty{opacity:.9}.builder-draft-status.saved{opacity:.7}
    .builder-canvas-wrap{padding:18px;overflow:auto;flex:1}
    .builder-canvas{width:100%;max-width:980px;margin:auto;background:#fff;min-height:620px;border:1px solid #ddd;border-radius:10px;overflow:hidden;transition:max-width .2s ease}
    .builder-canvas.tablet{max-width:720px}.builder-canvas.mobile{max-width:390px}
    .builder-empty{padding:80px 24px;text-align:center;opacity:.45;font-size:14px}
    .page-block{position:relative;padding:28px;border-bottom:1px solid #eee;cursor:pointer;transition:outline .1s ease}
    .page-block.selected{outline:2px solid #6f8cff;outline-offset:-2px}.page-block.dragging{opacity:.35}
    .page-block-tools{position:absolute;right:8px;top:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s}.page-block:hover .page-block-tools,.page-block.selected .page-block-tools{opacity:1}.builder-move-handle{position:absolute;left:-32px;top:8px;width:28px;height:32px;display:grid;place-items:center;border:0;border-radius:6px;background:#242424;color:#ddd;font-size:18px;cursor:grab;opacity:0;pointer-events:none;z-index:46}.page-block:hover>.builder-move-handle,.page-block.dragging>.builder-move-handle{opacity:1;pointer-events:auto}.builder-move-handle:hover{background:#353535;color:#fff}.builder-move-handle:active{cursor:grabbing}
    .block-tool{border:1px solid #ccc;background:#fff;color:#222;border-radius:7px;width:30px;height:30px;padding:0;display:grid;place-items:center;cursor:pointer;font-size:17px;line-height:1;font-weight:700}.page-block-tools{z-index:45!important;pointer-events:auto}.page-block-tools .builder-danger{pointer-events:auto}
    .block-title{font-family:Georgia,serif;font-size:30px;margin:0 0 10px}.block-text{margin:0;line-height:1.6;opacity:.75}
    .block-image-placeholder{min-height:220px;border-radius:8px;background:linear-gradient(135deg,#ece7e1,#d9d1c8);display:grid;place-items:center;color:#6d6259}
    .block-button-demo{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:999px;background:#222;color:#fff;font-weight:700;font-size:13px}
    .block-divider{height:1px;background:#ddd}.block-spacer{height:90px}
    .block-widget-frame{display:block;width:100%;height:100%;min-height:420px;border:0;border-radius:10px;background:#191919;box-sizing:border-box}
    .inspector-field{margin-bottom:14px}.inspector-field label{font-size:12px}.inspector-field textarea,.inspector-field select{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;background:transparent;color:inherit;font:inherit}.inspector-field textarea{min-height:100px;resize:vertical}
    .builder-note{font-size:12px;line-height:1.5;opacity:.55}.builder-danger{color:#b34a4a}
    @media(prefers-color-scheme:dark){
      .builder-shell,.builder-toolbar,.builder-canvas{background:#191919;border-color:#444}.builder-panel{border-color:#444}.builder-main{background:#111}
      .builder-page:hover,.builder-block:hover{background:#242424}.builder-page.active{background:#302a2f}.builder-block{background:#202020;border-color:#444}
      .builder-toolbar{border-color:#444}.builder-mini{border-color:#555}.builder-mini.active{background:#fff;color:#191919;border-color:#fff}
      .page-block{border-color:#333}.block-tool{background:#242424;color:#fff;border-color:#555}.block-divider{background:#444}
      .inspector-field textarea,.inspector-field select{border-color:#555}
    }
    @media(max-width:1100px){.builder-shell{grid-template-columns:150px 190px minmax(320px,1fr)}.builder-inspector{grid-column:1/-1;border-left:0!important;border-top:1px solid #ddd}.builder-shell{min-height:auto}}
    @media(max-width:760px){.builder-shell{display:block}.builder-panel{border-right:0;border-bottom:1px solid #ddd}.builder-main{min-height:600px}}

    /* PAGE BUILDER V2 - full workspace */
    .builder-menu-frame{height:72px;border-radius:0;background:#191919}
    body.builder-mode{padding:0;overflow:hidden}
    body.builder-mode>.container{max-width:none;width:100%;height:100vh;margin:0}
    body.builder-mode>.container>h1,
    body.builder-mode>.container>.subtitle,
    body.builder-mode>.container>.tabs,
    body.builder-mode>.container>.library,
    body.builder-mode #button-tool,
    body.builder-mode #notebook-tool{display:none!important}
    body.builder-mode #page-builder-tool{display:block!important;height:100vh}
    body.builder-mode .builder-shell{height:100vh;min-height:0;border:0;border-radius:0;grid-template-columns:220px 270px minmax(520px,1fr) 280px}
    body.builder-mode .builder-panel{padding:18px;overflow:auto}
    body.builder-mode .builder-main{min-height:0}
    body.builder-mode .builder-canvas-wrap{padding:20px;overflow:auto}
    body.builder-mode .builder-canvas{max-width:1200px;min-height:calc(100vh - 82px)}
    .builder-section-spacer{height:28px}
    .builder-create-links{display:flex;flex-direction:column;gap:7px}
    .builder-create-link{appearance:none;width:100%;border:1px solid #ddd;border-radius:8px;background:transparent;color:inherit;text-align:left;padding:10px;font:inherit;font-size:13px;cursor:pointer}
    .builder-create-link:hover{background:#f5f5f5}
    .builder-saved-widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .builder-saved-widget{min-width:0;border:1px solid #ddd;border-radius:9px;padding:7px;background:transparent;color:inherit;cursor:grab;text-align:left}
    .builder-saved-widget:active{cursor:grabbing}
    .builder-saved-widget img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;border-radius:6px;background:#eee}
    .builder-saved-widget .widget-placeholder{height:70px;display:grid;place-items:center;font-size:24px}
    .builder-saved-widget-name{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px;opacity:.7}
    .builder-drop-ready{outline:2px dashed #6f8cff;outline-offset:-8px}
    @media(prefers-color-scheme:dark){
      .builder-create-link,.builder-saved-widget{border-color:#444}
      .builder-create-link:hover{background:#242424}
      .builder-saved-widget img{background:#242424}
    }
    @media(max-width:1250px){
      body.builder-mode .builder-shell{grid-template-columns:190px 230px minmax(430px,1fr) 240px}
    }

    /* TAB - distraction-free full-screen page check */
    body.builder-mode.builder-focus-mode .builder-shell{display:block!important;height:100vh!important}
    body.builder-mode.builder-focus-mode .builder-panel,
    body.builder-mode.builder-focus-mode .builder-toolbar{display:none!important}
    body.builder-mode.builder-focus-mode .builder-main{display:block!important;width:100vw!important;height:100vh!important;background:#191919!important}
    body.builder-mode.builder-focus-mode .builder-canvas-wrap{padding:0!important;overflow:auto!important;width:100vw!important;height:100vh!important}
    body.builder-mode.builder-focus-mode .builder-canvas{
      width:100vw!important;max-width:none!important;min-height:100vh!important;
      margin:0!important;border:0!important;border-radius:0!important
    }
    body.builder-mode.builder-focus-mode .builder-grid{width:100%!important}
    body.builder-mode.builder-focus-mode .page-block-tools,
    body.builder-mode.builder-focus-mode .builder-resize-handle,
    body.builder-mode.builder-focus-mode .builder-size-readout,
    body.builder-mode.builder-focus-mode .page-block.selected{outline:0!important}
    body.builder-mode.builder-focus-mode .page-block{cursor:default!important}

    /* CLEAN PREVIEW MODE */
    body.builder-preview-mode{margin:0;padding:0;background:#191919;overflow:auto}
    body.builder-preview-mode>.container{max-width:none;width:100%;margin:0}
    body.builder-preview-mode>.container>h1,
    body.builder-preview-mode>.container>.subtitle,
    body.builder-preview-mode>.container>.tabs,
    body.builder-preview-mode>.container>.library,
    body.builder-preview-mode #button-tool,
    body.builder-preview-mode #notebook-tool,
    body.builder-preview-mode #page-builder-tool{display:none!important}
    .site-preview{min-height:100vh;background:#191919;color:#f5f5f5}

  <script>

    const STORAGE_KEY =
      "myWebsiteWidgets";

    const URL_PARAMS = new URLSearchParams(window.location.search);
    const EDITOR_QUERY = URL_PARAMS.get("editor");
    const PREVIEW_MODE = URL_PARAMS.get("preview") === "1";
    if (PREVIEW_MODE) {
      document.body.classList.add("builder-preview-mode");
      document.querySelectorAll("body > .container").forEach(el=>el.style.display="none");
    }
    else if (!EDITOR_QUERY || EDITOR_QUERY === "page-builder") document.body.classList.add("builder-mode");

    const MAX_NOTEBOOK_PAGES =
      200;


    /* ===================================== */
    /* TABS                                  */
    /* ===================================== */

    const tabButtons =
      document.querySelectorAll(
        ".tab-button"
      );

    const tabContents =
      document.querySelectorAll(
        ".tab-content"
      );


    function openTab(
      target
    ) {

      tabButtons.forEach(
        function (button) {

          button.classList.toggle(
            "active",
            button.dataset.tab === target
          );

        }
      );


      tabContents.forEach(
        function (content) {

          content.classList.toggle(
            "active",
            content.id === target
          );

        }
      );

    }


    tabButtons.forEach(
      function (button) {

        button?.addEventListener(
          "click",
          function () {

            openTab(
              button.dataset.tab
            );

          }
        );

      }
    );




    /* ===================================== */
    /* STORAGE                               */
    /* ===================================== */

    function getWidgets() {

      try {

        const saved =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!saved) {
          return [];
        }


        const widgets =
          JSON.parse(saved);


        return Array.isArray(widgets)
          ? widgets
          : [];

      }
      catch (error) {

        return [];

      }

    }


    function saveWidgets(
      widgets
    ) {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(widgets)
      );

    }


    function addWidget(
      widget
    ) {

      const widgets =
        getWidgets();


      widgets.push(
        widget
      );


      saveWidgets(
        widgets
      );


      renderWidgets();

    }


    function replaceWidget(
      index,
      widget
    ) {

      const widgets =
        getWidgets();


      if (
        index < 0 ||
        index >= widgets.length
      ) {
        return false;
      }


      widgets[index] =
        widget;


      saveWidgets(
        widgets
      );


      renderWidgets();


      return true;

    }


    function deleteWidget(
      index
    ) {

      const widgets =
        getWidgets();


      const widget =
        widgets[index];


      if (!widget) {
        return;
      }


      const widgetName =
        widget.name ||
        (
          widget.type === "notebook"
            ? "Notebook"
            : "Button"
        );


      const confirmed =
        window.confirm(
          "Удалить «" +
          widgetName +
          "» из My Widgets?\\n\\n" +
          "Сам виджет и файлы на GitHub удалены не будут."
        );


      if (!confirmed) {
        return;
      }


      widgets.splice(
        index,
        1
      );


      saveWidgets(
        widgets
      );


      /*
        Если удалили именно тот блокнот,
        который сейчас редактируется,
        выходим из режима редактирования.
      */

      if (
        editingNotebookIndex === index
      ) {

        exitEditMode();

      }
      else if (
        editingNotebookIndex !== null &&
        index < editingNotebookIndex
      ) {

        editingNotebookIndex--;

      }


      renderWidgets();

    }


    /* ===================================== */
    /* PATH HELPERS                          */
    /* ===================================== */

    function cleanPath(
      path
    ) {

      return path
        .trim()
        .replace(
          /^\/+/,
          ""
        );

    }


    function normalizeFolder(
      folder
    ) {

      folder =
        cleanPath(folder);


      if (
        folder &&
        !folder.endsWith("/")
      ) {

        folder += "/";

      }


      return folder;

    }


    function assetUrl(
      path
    ) {

      return new URL(
        cleanPath(path),
        window.location.href
      ).toString();

    }


    function formatPageNumber(
      number
    ) {

      return String(number)
        .padStart(
          2,
          "0"
        );

    }


    /* ===================================== */
    /* NOTEBOOK ELEMENTS                     */
    /* ===================================== */

    const notebookName =
      document.getElementById(
        "notebook-name"
      );

    const notebookFolder =
      document.getElementById(
        "notebook-folder"

      );

      );

    const clearNotebookButton =
      document.getElementById(
        "clear-notebook"
      );

    const pageCheckResult =
      document.getElementById(
        "page-check-result"
      );

    const pageCheckTitle =
      document.getElementById(
        "page-check-title"
      );

    const pageCheckList =
      document.getElementById(
        "page-check-list"
      );

    const pageCount =
      document.getElementById(
        "page-count"
      );

    const notebookResult =
      document.getElementById(
        "notebook-result"
      );

    const notebookUrl =
      document.getElementById(
        "notebook-url"
      );

    const notebookPreview =
      document.getElementById(
        "notebook-preview"
      );

    const copyNotebook =
      document.getElementById(
        "copy-notebook"
      );

    const saveNotebook =
      document.getElementById(
        "save-notebook"
      );

    const notebookMessage =
      document.getElementById(
        "notebook-message"
      );

    const editMode =
      document.getElementById(
        "edit-mode"
      );

    const editWidgetName =
      document.getElementById(
        "edit-widget-name"
      );


    let foundNotebookPages =
      [];

    let currentNotebookUrl =
      "";

    let currentNotebookCover =
      "";

    let editingNotebookIndex =
      null;


    /* ===================================== */
    /* RESET CHECK                           */
    /* ===================================== */

    function resetNotebookCheck() {

      foundNotebookPages =
        [];

      currentNotebookUrl =

    function getNotebookDataFromWidget(
      widget
    ) {

      let folder =
        widget.folder || "";

      let prefix =
        widget.prefix || "";


      /*
        Совместимость со старыми блокнотами.

        Если folder/prefix ещё не сохранялись,
        пытаемся получить их из:

        assets/notebooks/name/name_00.png
      */

      if (
        (!folder || !prefix) &&
        (
          widget.cover ||
          widget.preview
        )
      ) {

        const cover =
          cleanPath(
            widget.cover ||
            widget.preview
          );


        const slashIndex =
          cover.lastIndexOf("/");


        if (
          slashIndex !== -1
        ) {

          folder =
            cover.substring(
              0,
              slashIndex + 1
            );


          const filename =
            cover.substring(
              slashIndex + 1
            );


          prefix =
            filename.replace(
              /_00\.[^.]+$/i,
              ""
            );

        }

      }


      return {
        folder:
          normalizeFolder(folder),

        prefix:
          prefix
      };

    }

      notebookFolder.value =

    async function checkNotebookPages() {

      const folder =
        normalizeFolder(
          notebookFolder.value
        );


      const prefix =
        notebookPrefix
          .value
          .trim();


      if (!folder) {

        alert(
          "Укажи папку блокнота."
        );

        return;

      }


      if (!prefix) {

        alert(
          "Укажи префикс файлов."
        );

        return;

      }


      resetNotebookCheck();


      checkPagesButton.disabled =
        true;


      checkPagesButton.textContent =
        "Проверяю...";


      pageCheckResult
        .classList
        .add("visible");


      pageCheckTitle.textContent =
        "Проверка страниц...";


      currentNotebookCover =
        folder +
        prefix +
        "_00.png";


      const pages =
        [];


      let firstMissingPath =
        "";


      for (
        let page = 1;
        page <= MAX_NOTEBOOK_PAGES;
        page++
      ) {

        const filename =
          prefix +
          "_" +
          formatPageNumber(page) +
          ".png";


        const path =
          folder +
          filename;


        const exists =
          await fileExists(path);


        if (!exists) {

          firstMissingPath =
            path;

          break;

        }


        pages.push(
          path
        );


        const line =
          document.createElement(
            "div"
          );


        line.className =
          "page-found";


        line.textContent =
          "✓ " +
          filename;


        pageCheckList.appendChild(
          line
        );

      }


      foundNotebookPages =
        pages;


      if (firstMissingPath) {

        const missingLine =
          document.createElement(
            "div"
          );


        missingLine.className =
          "page-missing";


        missingLine.textContent =
          "✕ " +
          firstMissingPath
            .split("/")
            .pop() +
          " - не найден";


        pageCheckList.appendChild(
          missingLine
        );

      }


      if (
        foundNotebookPages.length > 0
      ) {

        pageCheckTitle.textContent =
          "Страницы найдены ✓";


        pageCount.textContent =
          "Найдено страниц: " +
          foundNotebookPages.length;


        createNotebookButton.disabled =
          false;

      }
      else {

        pageCheckTitle.textContent =
          "Страницы не найдены";


        pageCount.textContent =
          "Файл _01.png не найден. Проверь папку и префикс.";


        createNotebookButton.disabled =
          true;

      }


      checkPagesButton.disabled =
        false;


      checkPagesButton.textContent =
        "Проверить страницы";

    }

    function builderLoad(){

        const parsed=raw?JSON.parse(raw):null;

          builderState=parsed;

          // Keep an untouched recovery copy of the last valid browser draft.

        }else{

          builderState=(restored && Array.isArray(restored.pages) && restored.pages.length)?restored:structuredClone(builderDefault);

      if(builderState.pages.some(page=>builderPageHasCollisions(page))){

    async function builderGitHubWrite(path,payload,message,token){
      const api="https://api.github.com/repos/yanisky-art/website-assets/contents/"+path;
      const headers={Accept:"application/vnd.github+json",Authorization:"Bearer "+token.trim(),"X-GitHub-Api-Version":"2022-11-28"};
      const current=await fetch(api,{headers});
      let sha=null;
      if(current.ok){const info=await current.json();sha=info.sha}
      else if(current.status!==404) throw new Error("GitHub не принял токен ("+current.status+")");
      const json=JSON.stringify(payload,null,2),bytes=new TextEncoder().encode(json);let binary="";bytes.forEach(b=>binary+=String.fromCharCode(b));
      const body={message,content:btoa(binary),branch:"main"};if(sha)body.sha=sha;
      const res=await fetch(api,{method:"PUT",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!res.ok)throw new Error("Ошибка записи GitHub ("+res.status+")");
      return res.json();
    }

    function builderValidateInsertionPlan(page,moving,plan){

        if(builderSelected||builderSelectedFolder){builderSelected=null;builderSelectedFolder=null;builderUpdateSelectionUI()}
      };
      const grid=document.createElement("div");grid.className="builder-grid";const pageRows=builderEnsurePageRows(page);grid.style.minHeight=(pageRows*BUILDER_ROW_PX)+"px";canvas.style.minHeight=(pageRows*BUILDER_ROW_PX+24)+"px";canvas.appendChild(grid);

      

      if(!page.blocks.length){grid.appendChild(builderCreateEmptyState(grid));return;}

      page.blocks.forEach(block=>grid.appendChild(builderCreateBlockElement(block,grid,canvas,page)));
      const pageResizer=document.createElement("div");pageResizer.className="builder-page-resizer";pageResizer.title="Потяни вверх или вниз, чтобы изменить длину страницы";
      pageResizer.onpointerdown=e=>{
        e.preventDefault();e.stopPropagation();pageResizer.classList.add("resizing");pageResizer.setPointerCapture(e.pointerId);
        const startY=e.clientY,startRows=builderEnsurePageRows(page);let resizeScrollY=0,lastClientY=e.clientY,autoFrame=0,activeResize=true;
        const applyResize=()=>{
          const delta=Math.round((lastClientY-startY+resizeScrollY)/BUILDER_ROW_PX);
          const minRows=Math.max(21,builderPageContentRows(page)+2);
          page.pageRows=Math.max(minRows,startRows+delta);
          try{localStorage.setItem(PAGE_BUILDER_KEY+":pageRows:"+page.id,String(page.pageRows))}catch(e){}
          grid.style.minHeight=(page.pageRows*BUILDER_ROW_PX)+"px";canvas.style.minHeight=(page.pageRows*BUILDER_ROW_PX+24)+"px";
        };
        const autoScroll=()=>{
          if(!activeResize)return;
          resizeScrollY+=builderAutoScrollWorkspace(lastClientY);applyResize();
          autoFrame=requestAnimationFrame(autoScroll);
        };
        const move=ev=>{lastClientY=ev.clientY;applyResize()};
        autoFrame=requestAnimationFrame(autoScroll);
        const finish=ev=>{
          try{pageResizer.releasePointerCapture(ev.pointerId)}catch(err){}
          window.removeEventListener("pointermove",move,true);window.removeEventListener("pointerup",finish,true);window.removeEventListener("pointercancel",finish,true);
          activeResize=false;cancelAnimationFrame(autoFrame);applyResize();pageResizer.classList.remove("resizing");
          // Commit the page length as an explicit per-page value. Do not depend on
          // builderPersist(), because its collision safety gate may reject an otherwise
          // valid page-height-only change.
          page.pageRows=Math.max(Math.max(21,builderPageContentRows(page)+2),Math.round(page.pageRows||startRows));
          builderHistoryCommit();
          try{
            const next=JSON.stringify(builderState);
            localStorage.setItem(PAGE_BUILDER_KEY,next);
            localStorage.setItem(PAGE_BUILDER_KEY+":pageRows:"+page.id,String(page.pageRows));
            builderDraftDirty=false;builderDraftStatus("Черновик сохранён","saved");
          }catch(err){builderMarkDirty()}
        };
        window.addEventListener("pointermove",move,true);window.addEventListener("pointerup",finish,true);window.addEventListener("pointercancel",finish,true);
      };
      grid.appendChild(pageResizer);

      grid.querySelectorAll("[data-delete]").forEach(x=>x.onclick=()=>builderDeleteBlock(x.dataset.delete));
      // Rebuilding the canvas must not look like the page collapsed. Clearing and
      // recreating the grid can reset the workspace scroll position to the top.
      if(scrollWrap){
        scrollWrap.scrollTop=keepScrollTop;scrollWrap.scrollLeft=keepScrollLeft;
        requestAnimationFrame(()=>{scrollWrap.scrollTop=keepScrollTop;scrollWrap.scrollLeft=keepScrollLeft});
      }
    }

    function builderRenderInspector(){
      const host=document.getElementById("builder-inspector"); if(!host)return;
      const block=builderPage().blocks.find(x=>x.id===builderSelected);
      if(!block){host.innerHTML='<p class="builder-note">Выбери блок на странице, чтобы изменить его.</p>';return}
      const layerHtml='<div class="inspector-field"><label>Прозрачность</label><div class="builder-opacity-row"><input id="builder-opacity" type="range" min="0" max="100" value="'+(block.opacity??100)+'"><span id="builder-opacity-value">'+(block.opacity??100)+'%</span></div></div><div class="inspector-field"><label>Видимость по устройствам</label><div class="builder-width-options">'+["desktop","tablet","mobile"].map(d=>'<button type="button" class="builder-width-btn'+(block.deviceVisibility?.[d]!==false?" active":"")+'" data-device-visible="'+d+'">'+({desktop:"Desktop",tablet:"Tablet",mobile:"Mobile"})[d]+'</button>').join("")+'</div></div>';
      const span=builderSpan(block),height=builderHeight(block);
      const widthHtml='<div class="inspector-field"><label>Ширина блока</label><div class="builder-width-options">'+[[6,"25%"],[8,"33%"],[12,"50%"],[16,"66%"],[18,"75%"],[24,"100%"]].map(([s,l])=>'<button type="button" class="builder-width-btn'+(span===s?" active":"")+'" data-span="'+s+'">'+l+'</button>').join("")+'</div><p class="builder-note">Сетка теперь состоит из 24 сегментов. За края можно менять одну сторону, за уголки - ширину и высоту одновременно.</p></div><div class="inspector-field"><label>Высота блока</label><div class="builder-height-row"><input id="builder-height-input" type="number" min="48" step="1" value="'+(height||"")+'" placeholder="Авто"><button class="builder-mini" id="builder-height-auto" type="button">Авто</button></div></div>';
      let body="";
      if(["divider","spacer","price-calculator","saved-widget","site-menu"].includes(block.type)){
        const name=block.type==="price-calculator"?"Калькулятор стоимости":block.type==="saved-widget"?(block.title||"Сохранённый виджет"):block.type==="site-menu"?"Переключение страниц":block.type==="divider"?"Разделитель":"Пустое пространство";
        body='<p><strong>'+builderEsc(name)+'</strong></p>';
      }else{
        body='<div class="inspector-field"><label>Заголовок</label><textarea id="builder-edit-title">'+builderEsc(block.title||"")+'</textarea></div><div class="inspector-field"><label>'+(block.type==="button"?"Текст кнопки":"Текст")+'</label><textarea id="builder-edit-text">'+builderEsc(block.text||"")+'</textarea></div>';
      }
      host.innerHTML=body+layerHtml+widthHtml;
      host.querySelectorAll("[data-span]").forEach(btn=>btn.onclick=()=>builderSetSpan(block,+btn.dataset.span));
      const op=document.getElementById("builder-opacity");if(op)op.oninput=()=>{block.opacity=+op.value;document.getElementById("builder-opacity-value").textContent=op.value+"%";const el=document.querySelector('.page-block[data-id="'+block.id+'"]');if(el)el.style.opacity=op.value/100;builderRenderLayers()};
      host.querySelectorAll("[data-device-visible]").forEach(btn=>btn.onclick=()=>{block.deviceVisibility=block.deviceVisibility||{desktop:true,tablet:true,mobile:true};const d=btn.dataset.deviceVisible;block.deviceVisibility[d]=block.deviceVisibility[d]===false?true:false;btn.classList.toggle("active",block.deviceVisibility[d]!==false)});
      const hi=document.getElementById("builder-height-input");if(hi)hi.onchange=()=>{block.height=hi.value?Math.max(48,+hi.value):null;builderRenderCanvas();builderRenderInspector()};
      const ha=document.getElementById("builder-height-auto");if(ha)ha.onclick=()=>{block.height=null;builderRenderCanvas();builderRenderInspector()};
      const t=document.getElementById("builder-edit-title"),x=document.getElementById("builder-edit-text");
      if(t)t.oninput=()=>{block.title=t.value;builderRenderCanvas()};
      if(x)x.oninput=()=>{block.text=x.value;builderRenderCanvas()};
    }

    function builderSavedWidgets(){
      const host=document.getElementById("builder-saved-widgets"); if(!host)return;
      host.innerHTML="";
      const widgets=getWidgets();
      const all=[{type:"price-calculator",name:"Калькулятор стоимости",url:new URL("./price-calculator/",window.location.href).toString(),system:true},...widgets];
      if(!all.length){host.innerHTML='<p class="builder-note">Пока нет сохранённых виджетов.</p>';return}
      all.forEach((w,index)=>{
        const card=document.createElement("div");card.className="builder-saved-widget";card.draggable=false;
        const imagePath=w.preview||w.cover||w.image||"";
        if(imagePath){
          const img=document.createElement("img");
          img.src=/^https?:\/\//i.test(imagePath)?imagePath:assetUrl(imagePath);
          card.appendChild(img);
        }else{
          const ph=document.createElement("div");ph.className="widget-placeholder";ph.textContent=w.type==="price-calculator"?"⌗":w.type==="notebook"?"📖":"✦";card.appendChild(ph);
        }
        const n=document.createElement("div");n.className="builder-saved-widget-name";n.textContent=w.name||"Widget";card.appendChild(n);
        const payload={kind:"widget",widget:{type:w.type,name:w.name||"Widget",url:w.url||"",system:!!w.system}};
        card.onpointerdown=e=>{
          if(e.button!==0)return;e.preventDefault();
          const startX=e.clientX,startY=e.clientY;let active=false,ghost=null,rowPlan=null,incoming=null;
          const move=ev=>{
            if(!active&&Math.hypot(ev.clientX-startX,ev.clientY-startY)<7)return;
            if(!active){
              active=true;document.body.classList.add("builder-pointer-drag");
              incoming=builderMakeWidgetBlock(payload.widget);builderGridNormalize(incoming);incoming.gridW=Math.min(incoming.gridW,6);incoming.span=incoming.gridW;
              ghost=document.createElement("div");ghost.className="builder-drag-ghost";const ghostW=Math.max(72,Math.min(150,card.getBoundingClientRect().width));ghost.style.width=ghostW+"px";ghost.style.height=Math.max(64,Math.min(110,card.getBoundingClientRect().height))+"px";
              const source=card.querySelector("img");if(source){const im=source.cloneNode();ghost.appendChild(im)}else ghost.textContent=payload.widget.name||"Widget";
              document.body.appendChild(ghost);
            }
            ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";
            const grid=document.querySelector("#builder-canvas .builder-grid");if(!grid)return;
            const r=grid.getBoundingClientRect();builderClearRowPlan(grid,builderPage());
            if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom){rowPlan=null;return}
            const p=builderPage();builderGridMigrate(p),col=(r.width-23*6)/24;
            incoming.gridX=Math.max(1,Math.min(BUILDER_COLS-incoming.gridW+1,Math.round((ev.clientX-r.left)/(col+6))+1-Math.floor(incoming.gridW/2)));
            incoming.gridY=Math.max(1,Math.round((ev.clientY-r.top)/BUILDER_ROW_PX)+1-Math.floor(incoming.gridH/2));
            rowPlan=builderInsertionPlan(p,incoming,incoming.gridX,incoming.gridY);builderShowRowPlan(grid,rowPlan);
          };
          const up=ev=>{
            window.removeEventListener("pointermove",move,true);window.removeEventListener("pointerup",up,true);document.body.classList.remove("builder-pointer-drag");ghost?.remove();
            const grid=document.querySelector("#builder-canvas .builder-grid");if(grid)builderClearRowPlan(grid,builderPage());
            if(!active||!grid||!incoming)return;
            const r=grid.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)return;
            const p=builderPage();builderGridMigrate(p);
            if(!rowPlan&&p.blocks.some(o=>builderGridCollides(incoming,o)))return;
            p.blocks.push(incoming);
            if(rowPlan&&!builderApplyRowPlan(p,rowPlan)){p.blocks=p.blocks.filter(o=>o.id!==incoming.id);return}
            const finalOverlap=p.blocks.some(o=>o.id!==incoming.id&&builderGridCollides(incoming,o));
            if(finalOverlap){p.blocks=p.blocks.filter(o=>o.id!==incoming.id);return}
            builderSelected=incoming.id;builderSelectedFolder=null;if(!builderReconcileCanvas())builderRenderCanvas();builderHistoryCommit();
          };
          window.addEventListener("pointermove",move,true);window.addEventListener("pointerup",up,true);
        };
        host.appendChild(card);
      });
    }

    function builderMakeBlock(type){
      const b={id:builderUid(),type,title:"",text:"",span:24,gridVersion:24,visible:true,locked:false,opacity:100,deviceVisibility:{desktop:true,tablet:true,mobile:true}};
      if(type==="text"){b.title="Новый заголовок";b.text="Добавь текст в настройках справа."}
      if(type==="image")b.title="Изображение";
      if(type==="button"){b.title="Кнопка";b.text="Открыть"}
      return b;
    }
    function builderMakeWidgetBlock(w){
      return {id:builderUid(),type:w.type==="price-calculator"?"price-calculator":"saved-widget",title:w.name||"Widget",url:w.url||"",span:24,gridVersion:24,gridH:10,visible:true,locked:false,opacity:100,deviceVisibility:{desktop:true,tablet:true,mobile:true}};
    }
    function builderInsertBlock(type,atIndex=null){
      const b=builderMakeBlock(type),blocks=builderPage().blocks;
      builderGridMigrate(builderPage());builderGridNormalize(b);const pos=builderGridFindFree(builderPage(),b.gridW,b.gridH);b.gridX=pos.x;b.gridY=pos.y;if(atIndex===null)blocks.push(b);else blocks.splice(Math.max(0,atIndex),0,b);
      builderSelected=b.id;if(!builderAppendBlockWithoutCanvasRebuild(b))builderRenderCanvas();builderRenderLayers();builderRenderInspector();builderEnableCanvasDrop();builderHistoryCommit();return b;
    }

    function builderInsertWidget(w,atIndex=null){
      const block=builderMakeWidgetBlock(w);
      const blocks=builderPage().blocks;
      builderGridMigrate(builderPage());builderGridNormalize(block);const pos=builderGridFindFree(builderPage(),block.gridW,block.gridH);block.gridX=pos.x;block.gridY=pos.y;if(atIndex===null)blocks.push(block);else blocks.splice(atIndex,0,block);
      builderSelected=block.id;if(!builderAppendBlockWithoutCanvasRebuild(block))builderRenderCanvas();builderRenderLayers();builderRenderInspector();builderEnableCanvasDrop();builderHistoryCommit();
    }

    document.querySelectorAll("[data-widget-editor]").forEach(btn=>btn.addEventListener("click",()=>{
      const u=new URL(window.location.href);u.searchParams.set("editor",btn.dataset.widgetEditor);
      window.open(u.toString(),"_blank","noopener");
    }));

    function builderEnableCanvasDrop(){
      const canvas=document.getElementById("builder-canvas");if(!canvas)return;
      canvas.ondragover=e=>{if(e.dataTransfer.types.includes("application/json")){e.preventDefault();canvas.classList.add("builder-drop-ready")}};
      canvas.ondragleave=e=>{if(!canvas.contains(e.relatedTarget))canvas.classList.remove("builder-drop-ready")};
      canvas.ondrop=e=>{
        // Insert zones and the empty-state have their own drop handlers.
        // Do not let the canvas create a second copy of the same dragged block.
        if(e.target.closest(".builder-empty")||e.target.closest(".page-block"))return;
        const raw=e.dataTransfer.getData("application/json");if(!raw)return;
        e.preventDefault();e.stopPropagation();canvas.classList.remove("builder-drop-ready");
        try{const data=JSON.parse(raw);if(data.kind==="widget")builderInsertWidget(data.widget);else if(data.kind==="block")builderInsertBlock(data.type)}catch(err){}
      };
    }

    function builderRenderPreview(){
      document.body.classList.remove("builder-mode");
      document.body.classList.add("builder-preview-mode");
      const page=builderPage();
      const site=document.createElement("main");site.className="site-preview";
      const inner=document.createElement("div");inner.className="site-preview-inner";
      const grid=document.createElement("div");grid.className="site-preview-grid";
      page.blocks.forEach(block=>{
        const el=document.createElement("section");el.className="site-preview-block";
        el.style.setProperty("--builder-span",builderSpan(block));
        const h=builderHeight(block);el.style.setProperty("--builder-height",h?h+"px":"auto");
        el.innerHTML=builderBlockMarkup(block);
        grid.appendChild(el);
      });
      inner.appendChild(grid);site.appendChild(inner);document.body.appendChild(site);
      document.title=page.name+" - YANISKY Preview";
    }

    function builderRender(){
      const tool=document.getElementById("page-builder-tool");
      if(tool){tool.classList.add("active");tool.style.display="block"}
      // Render independent panels defensively: a canvas/layers error must not hide saved widgets.
      try{builderRenderPages()}catch(err){console.error("[YANISKY] pages render failed",err)}
      try{builderRenderCanvas()}catch(err){console.error("[YANISKY] canvas render failed",err)}
      try{builderRenderLayers()}catch(err){console.error("[YANISKY] layers render failed",err)}
      try{builderRenderInspector()}catch(err){console.error("[YANISKY] inspector render failed",err)}
      try{builderSavedWidgets()}catch(err){console.error("[YANISKY] saved widgets render failed",err)}
      try{builderEnableCanvasDrop()}catch(err){console.error("[YANISKY] canvas drop setup failed",err)}
      builderHistoryCommit()
    }
    window?.addEventListener("message",e=>{
      const d=e.data;
      if(!d||d.type!=="yanisky-widget-size"||!Number.isFinite(Number(d.height)))return;
      document.querySelectorAll(".block-widget-frame").forEach(frame=>{
        if(frame.contentWindow===e.source){
          const h=Math.max(72,Math.ceil(Number(d.height)));
          const blockEl=frame.closest(".page-block"),dataBlock=blockEl?builderPage().blocks.find(b=>b.id===blockEl.dataset.id):null;
          if(dataBlock&&!builderHeight(dataBlock)){
            builderGridAutoHeight(dataBlock,h);
            blockEl.style.setProperty("--grid-h",dataBlock.gridH);
            frame.style.height="100%";frame.style.minHeight="0";
          }else{frame.style.height=h+"px";frame.style.minHeight=h+"px"}
        }
      });
    });
    builderLoad();
    console.info("[YANISKY] Page Builder restored",builderState.pages.length,"pages,",builderState.pages.reduce((n,p)=>n+(p.blocks?.length||0),0),"blocks,",getWidgets().length,"saved widgets");
    builderHistoryInit();
    // Render the recovered project immediately, before any optional toolbar/event wiring.
    // This keeps pages, blocks and saved widgets visible even if a secondary control fails later.
    if(!PREVIEW_MODE) builderRender();

    document.querySelectorAll("[data-builder-add]").forEach(btn=>{
      btn.draggable=true;
      btn?.addEventListener("click",()=>builderInsertBlock(btn.dataset.builderAdd));
      btn?.addEventListener("dragstart",e=>{
        btn.classList.add("drag-source");
        e.dataTransfer.effectAllowed="copy";
        e.dataTransfer.setData("application/json",JSON.stringify({kind:"block",type:btn.dataset.builderAdd}));
      });
      btn?.addEventListener("dragend",()=>btn.classList.remove("drag-source"));
    });
    document.getElementById("builder-undo")?.addEventListener("click",builderUndo);
    document.getElementById("builder-redo")?.addEventListener("click",builderRedo);
    document.getElementById("builder-copy-top")?.addEventListener("click",()=>builderCopySelection(false));
    document.getElementById("builder-cut-top")?.addEventListener("click",()=>builderCopySelection(true));
    document.getElementById("builder-paste-top")?.addEventListener("click",()=>builderPaste());
    document.getElementById("builder-duplicate-top")?.addEventListener("click",()=>{if(builderSelected)builderDuplicateBlock(builderSelected);else if(builderSelectedFolder){builderCopySelection(false);builderPaste()}});
    document.getElementById("builder-lock-top")?.addEventListener("click",()=>{if(builderSelected)builderToggleLock(builderSelected)});
    document.getElementById("builder-delete-top")?.addEventListener("click",()=>{if(builderSelected)builderDeleteBlock(builderSelected);else if(builderSelectedFolder){const p=builderPage();p.folders=(p.folders||[]).filter(g=>g.id!==builderSelectedFolder);builderSelectedFolder=null;builderRender()}});

    document.querySelectorAll("[data-builder-device]").forEach(btn=>btn.addEventListener("click",()=>{
      document.querySelectorAll("[data-builder-device]").forEach(x=>x.classList.toggle("active",x===btn));
      const canvas=document.getElementById("builder-canvas");canvas.classList.remove("tablet","mobile");if(btn.dataset.builderDevice!=="desktop")canvas.classList.add(btn.dataset.builderDevice);
    }));
    document.getElementById("builder-preview")?.addEventListener("click",e=>{
      e.preventDefault();
      // Preview must always reflect the live editor state, even before a manual save.
      // Do not route preview through builderPersist(): the strict collision guard is for
      // durable saves/publishing and must not prevent a read-only preview.
      try{
        localStorage.setItem(PAGE_BUILDER_KEY,JSON.stringify(builderState));
        const sourceGrid=document.querySelector(".builder-grid");
        const sourceWidth=sourceGrid?.getBoundingClientRect().width||0;
        if(sourceWidth>0){
          localStorage.setItem("yaniskyPreviewSourceWidth",String(sourceWidth));
          const geometry={};
          sourceGrid.querySelectorAll(".page-block[data-id]").forEach(el=>{
            const r=el.getBoundingClientRect();
            geometry[el.dataset.id]={width:r.width,height:r.height};
          });
          localStorage.setItem("yaniskyPreviewBlockGeometry",JSON.stringify(geometry));
        }
      }
      catch(err){alert("Не удалось подготовить предпросмотр.");return}
      const u=new URL("./preview.html",window.location.href);
      u.searchParams.set("page",builderPage().id);
      u.searchParams.set("preview",Date.now().toString());
      window.open(u.toString(),"_blank","noopener");
    });
    document.getElementById("builder-save")?.addEventListener("click",e=>{builderPersist();const old=e.target.textContent;e.target.textContent="Сохранено ✓";setTimeout(()=>e.target.textContent=old,1200)});
    document.getElementById("builder-backup")?.addEventListener("click",e=>builderBackup(e.currentTarget));
    document.getElementById("builder-publish")?.addEventListener("click",e=>builderPublish(e.currentTarget));
    document.getElementById("page-builder-tool")?.addEventListener("pointerdown",e=>{
      if(!builderSelected&&!builderSelectedFolder)return;
      if(e.target.closest(".page-block,.builder-layers,.builder-inspector,.builder-toolbar,.builder-panel,.builder-resize-handle"))return;
      builderSelected=null;builderSelectedFolder=null;builderUpdateSelectionUI();
    });
    document?.addEventListener("keydown",e=>{
      if(!document.body.classList.contains("builder-mode")||PREVIEW_MODE)return;
      const tag=(e.target?.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select"||e.target?.isContentEditable)return;
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"&&(builderSelected||builderSelectedFolder)){e.preventDefault();builderCopySelection(false);return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="x"&&(builderSelected||builderSelectedFolder)){e.preventDefault();builderCopySelection(true);return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="v"&&builderLoadClipboard()){e.preventDefault();builderPaste();return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();if(e.shiftKey)builderRedo();else builderUndo();return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();builderRedo();return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"&&(builderSelected||builderSelectedFolder)){e.preventDefault();builderCopySelection(false);builderPaste()}
      if((e.key==="Delete"||e.key==="Backspace")&&builderSelected){e.preventDefault();builderDeleteBlock(builderSelected)}
   },true);;
    document?.addEventListener("keydown",e=>{
      if(e.key!=="Tab" || PREVIEW_MODE)return;
      const tag=(e.target?.tagName||"").toLowerCase();
      if(tag==="input"||tag==="textarea"||tag==="select"||e.target?.isContentEditable)return;
      if(!document.body.classList.contains("builder-mode"))return;
      e.preventDefault();
      document.body.classList.toggle("builder-focus-mode");
      if(document.body.classList.contains("builder-focus-mode")){
        builderSelected=null;
        builderRenderCanvas();
      }
    });
    document.getElementById("builder-add-folder")?.addEventListener("click",()=>{
      const p=builderPage();p.folders=p.folders||[];const selected=builderSelectedBlock();
      p.folders.push({id:"g"+builderUid(),name:"Новая папка",collapsed:false,children:selected?[selected.id]:[]});
      if(selected)p.folders.slice(0,-1).forEach(g=>g.children=(g.children||[]).filter(id=>id!==selected.id));
      builderRenderLayers();builderHistoryCommit();
    });
    document.getElementById("builder-add-page")?.addEventListener("click",()=>{
      const name=prompt("Название новой страницы:");if(!name)return;const id=name.toLowerCase().trim().replace(/[^a-zа-я0-9]+/gi,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36).slice(-4);
      builderState.pages.push({id,name:name.trim().toUpperCase(),blocks:[],folders:[]});builderState.currentPage=id;builderSelected=null;builderRender();
    });
    const requestedPage=URL_PARAMS.get("page");
    if(requestedPage && builderState.pages.some(p=>p.id===requestedPage)) builderState.currentPage=requestedPage;
    if(PREVIEW_MODE) builderRenderPreview();


    /* ===================================== */
    /* START                                 */
    /* ===================================== */

    if (!PREVIEW_MODE && document.getElementById("widget-grid")) renderWidgets();



  document.addEventListener("dragstart",e=>{if(e.target.closest?.("#page-builder-shell"))e.preventDefault()},true);
