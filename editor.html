<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>YANISKY Page Builder</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;

      background: #ffffff;
      color: #222222;

      font-family: Arial, sans-serif;
    }

    body {
      padding: 40px 20px 70px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .subtitle {
      margin: 0 0 30px;
      opacity: 0.6;
      line-height: 1.5;
    }


    /* ===================================== */
    /* TABS                                  */
    /* ===================================== */

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-bottom: 25px;

      border-bottom: 1px solid #dddddd;
    }

    .tab-button {
      appearance: none;

      margin-bottom: -1px;
      padding: 12px 16px;

      border: 0;
      border-bottom: 2px solid transparent;

      background: transparent;
      color: inherit;

      font: inherit;
      font-weight: 600;

      cursor: pointer;

      opacity: 0.45;

      transition:
        opacity 0.15s ease,
        border-color 0.15s ease;
    }

    .tab-button:hover {
      opacity: 0.8;
    }

    .tab-button.active {
      opacity: 1;
      border-bottom-color: currentColor;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }


    /* ===================================== */
    /* TOOL PANEL                            */
    /* ===================================== */

    .tool-panel {
      padding: 25px;

      border: 1px solid #dddddd;
      border-radius: 14px;
    }

    .description {
      margin: 0 0 25px;
      opacity: 0.6;
      line-height: 1.5;
    }


    /* ===================================== */
    /* EDIT MODE                             */
    /* ===================================== */

    .edit-mode {
      display: none;

      margin-bottom: 22px;
      padding: 12px 14px;

      border: 1px solid #dddddd;
      border-radius: 9px;

      font-size: 13px;
      line-height: 1.5;
    }

    .edit-mode.visible {
      display: block;
    }

    .edit-mode strong {
      font-weight: 600;
    }


    /* ===================================== */
    /* FORM                                  */
    /* ===================================== */

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 11px 12px;

      border: 1px solid #cccccc;
      border-radius: 8px;

      background: transparent;
      color: inherit;

      font: inherit;
    }

    input:focus {
      outline: 2px solid currentColor;
      outline-offset: 1px;
    }

    .hint {
      margin-top: 6px;

      font-size: 12px;
      line-height: 1.5;

      opacity: 0.5;
    }


    /* ===================================== */
    /* ACTION BUTTONS                        */
    /* ===================================== */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin-top: 22px;
    }

    .action-button {
      appearance: none;

      padding: 10px 14px;

      border: 1px solid #aaaaaa;
      border-radius: 8px;

      background: transparent;
      color: inherit;

      font: inherit;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .action-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .action-button.primary {
      background: #222222;
      color: #ffffff;
      border-color: #222222;
    }

    .action-button:disabled {
      opacity: 0.3;
      cursor: default;
    }


    /* ===================================== */
    /* RESULTS                               */
    /* ===================================== */

    .result-area {
      display: none;

      margin-top: 30px;
      padding-top: 25px;

      border-top: 1px solid #dddddd;
    }

    .result-area.visible {
      display: block;
    }

    .result-title {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .result-url {
      width: 100%;

      padding: 12px;

      border: 1px solid #cccccc;
      border-radius: 8px;

      overflow-wrap: anywhere;

      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .preview-title {
      margin-top: 25px;
      margin-bottom: 10px;

      font-size: 14px;
      font-weight: 600;
    }

    .preview-frame {
      width: 100%;
      height: 380px;

      border: 1px solid #dddddd;
      border-radius: 10px;

      overflow: hidden;
    }

    .preview-frame iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;
    }


    /* ===================================== */
    /* PAGE CHECKER                          */
    /* ===================================== */

    .page-check-result {
      display: none;

      margin-top: 22px;
      padding: 16px;

      border: 1px solid #dddddd;
      border-radius: 10px;
    }

    .page-check-result.visible {
      display: block;
    }

    .page-check-title {
      margin-bottom: 12px;
      font-weight: 600;
    }

    .page-check-list {
      display: flex;
      flex-direction: column;
      gap: 7px;

      font-family: monospace;
      font-size: 13px;
    }

    .page-found {
      line-height: 1.5;
    }

    .page-missing {
      margin-top: 3px;

      opacity: 0.45;
      line-height: 1.5;
    }

    .page-count {
      margin-top: 15px;
      padding-top: 12px;

      border-top: 1px solid #dddddd;

      font-weight: 600;
    }


    /* ===================================== */
    /* MESSAGES                              */
    /* ===================================== */

    .message {
      display: none;

      margin-top: 12px;

      font-size: 13px;
    }

    .message.visible {
      display: block;
    }


    /* ===================================== */
    /* MY WIDGETS                            */
    /* ===================================== */

    .library {
      margin-top: 50px;
      padding-top: 30px;

      border-top: 1px solid #dddddd;
    }

    .library h2 {
      margin-bottom: 18px;
    }

    .widget-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .widget-item {
      position: relative;
      width: 105px;
    }

    .widget-preview {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 105px;
      height: 105px;

      border: 1px solid #dddddd;
      border-radius: 12px;

      overflow: hidden;

      background: transparent;
      text-decoration: none;

      transition:
        transform 0.15s ease;
    }

    .widget-preview:hover {
      transform: translateY(-2px);
    }

    .widget-preview img {
      display: block;

      max-width: 88%;
      max-height: 88%;

      width: auto;
      height: auto;

      object-fit: contain;
    }

    .widget-placeholder {
      font-size: 38px;
      opacity: 0.55;
    }

    .widget-name {
      margin-top: 7px;

      overflow: hidden;

      text-align: center;

      font-size: 11px;

      white-space: nowrap;
      text-overflow: ellipsis;

      opacity: 0.55;
    }


    /* ===================================== */
    /* EDIT SAVED WIDGET                     */
    /* ===================================== */

    .edit-widget {
      display: block;

      width: 100%;

      margin-top: 5px;
      padding: 3px 4px;

      border: 0;

      background: transparent;
      color: inherit;

      font: inherit;
      font-size: 11px;

      cursor: pointer;

      opacity: 0.45;

      transition:
        opacity 0.15s ease;
    }

    .edit-widget:hover {
      opacity: 1;
    }


    /* ===================================== */
    /* DELETE WIDGET                         */
    /* ===================================== */

    .delete-widget {
      position: absolute;

      top: -7px;
      right: -7px;

      z-index: 5;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 24px;
      height: 24px;

      padding: 0;

      border: 1px solid #cccccc;
      border-radius: 50%;

      background: #ffffff;
      color: #222222;

      font-family: Arial, sans-serif;
      font-size: 17px;
      line-height: 1;

      cursor: pointer;

      opacity: 0;

      transform: scale(0.85);

      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .widget-item:hover .delete-widget,
    .delete-widget:focus {
      opacity: 1;
      transform: scale(1);
    }

    .delete-widget:hover {
      transform: scale(1.12);
    }


    /* ===================================== */
    /* DARK MODE                             */
    /* ===================================== */

    @media (prefers-color-scheme: dark) {
      .builder-layers{background:#191919;color:#fff}.builder-layer{color:#fff}.builder-layer:hover{background:#262626}.builder-layer.selected{background:#303030!important;border-color:#666!important;color:#fff!important}.builder-layer.hidden-layer{color:#fff}.builder-layer-icon,.builder-layer-action,.builder-layer-name{color:#fff}.builder-layer-name[contenteditable="true"]{background:#111;color:#fff}.builder-layer-folder-children{border-color:#444}.builder-layers-head{color:#fff}.builder-layers-head .builder-mini{color:#fff;border-color:#666;background:#191919}

      html,
      body {
        background: #191919;
        color: #ffffff;
      }

      .tabs,
      .library,
      .result-area {
        border-color: #444444;
      }

      .tool-panel,
      .preview-frame,
      .widget-preview,
      .page-check-result,
      .edit-mode {
        border-color: #444444;
      }

      .page-count {
        border-color: #444444;
      }

      input,
      .result-url {
        border-color: #555555;
      }

      .action-button {
        border-color: #666666;
      }

      .action-button.primary {
        background: #ffffff;
        color: #191919;
        border-color: #ffffff;
      }

      .delete-widget {
        background: #292929;
        color: #ffffff;
        border-color: #555555;
      }

    }


    /* ===================================== */
    /* TOUCH                                 */
    /* ===================================== */

    @media (hover: none) {

      .delete-widget {
        opacity: 0.7;
        transform: scale(1);
      }

    }


    /* ===================================== */
    /* MOBILE                                */
    /* ===================================== */

    @media (max-width: 600px) {

      body {
        padding: 25px 14px 50px;
      }

      .tool-panel {
        padding: 18px;
      }

      .preview-frame {
        height: 300px;
      }

    }

    /* ===================================== */
    /* PAGE BUILDER                          */
    /* ===================================== */
    #page-builder-tool.active{display:block}
    .builder-shell{display:grid;grid-template-columns:180px 210px minmax(360px,1fr) 230px;min-height:720px;border:1px solid #ddd;border-radius:14px;overflow:hidden;background:#fff}
    .builder-panel{padding:16px;border-right:1px solid #ddd;min-width:0}
    .builder-panel:last-child{border-right:0;border-left:1px solid #ddd}
    .builder-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.5;margin:0 0 12px}
    .builder-layers-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.builder-layer-add-folder{padding:5px 7px;font-size:10px}
    .builder-layers{display:flex;flex-direction:column;gap:3px;max-height:42vh;overflow:auto;padding-right:2px}
    .builder-layer{display:grid;grid-template-columns:18px 18px minmax(0,1fr) 18px;gap:4px;align-items:center;min-height:30px;padding:3px 5px;border:1px solid transparent;border-radius:6px;font-size:11px;cursor:pointer}
    .builder-layer:hover{background:#f5f5f5}.builder-layer.selected{background:#e9edff;border-color:#b9c4ff}.builder-layer.hidden-layer{opacity:.48}.builder-layer.locked-layer .builder-layer-name{opacity:.65}
    .builder-layer-icon,.builder-layer-action{appearance:none;border:0;background:transparent;color:inherit;padding:0;width:18px;height:18px;display:grid;place-items:center;font:inherit;font-size:11px;cursor:pointer;border-radius:4px}
    .builder-layer-action:hover{background:rgba(127,127,127,.18)}.builder-layer-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.builder-layer-name[contenteditable="true"]{outline:1px solid #6f8cff;background:#fff;padding:2px 3px;border-radius:3px}
    .builder-layer-folder{font-weight:700}.builder-layer-folder-children{padding-left:14px;border-left:1px solid #ddd;margin-left:8px}.builder-layer-drop{height:4px;border-radius:4px}.builder-layer-drop.drag-over{height:10px;background:#6f8cff55}
    .builder-layer-menu{display:flex;gap:4px;flex-wrap:wrap;margin:7px 0 10px}.builder-layer-menu .builder-mini{padding:5px 7px;font-size:10px}
    .builder-opacity-row{display:grid;grid-template-columns:1fr 48px;gap:7px;align-items:center}.builder-opacity-row input[type="range"]{width:100%}
    .page-block.builder-hidden{display:none!important}.page-block.builder-locked{cursor:not-allowed}.page-block.builder-locked .builder-resize-handle,.page-block.builder-locked .page-block-tools{display:none!important}
    .builder-pages,.builder-blocks{display:flex;flex-direction:column;gap:7px}
    .builder-page,.builder-block{appearance:none;width:100%;border:1px solid transparent;border-radius:8px;background:transparent;color:inherit;text-align:left;padding:9px 10px;font:inherit;font-size:13px;cursor:pointer}
    .builder-page:hover,.builder-block:hover{background:#f5f5f5}.builder-page.active{background:#eee;font-weight:700}
    .builder-block{border-color:#ddd;background:#fafafa}.builder-block small{display:block;opacity:.5;margin-top:3px}.builder-block[draggable="true"]{cursor:grab}.builder-block[draggable="true"]:active{cursor:grabbing;opacity:.7}.builder-block.drag-source{outline:2px solid #6f8cff;outline-offset:2px}
    .builder-main{min-width:0;background:#f5f5f5;display:flex;flex-direction:column}
    .builder-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #ddd;background:#fff;flex-wrap:wrap}
    .builder-toolbar-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .builder-mini{appearance:none;border:1px solid #ccc;border-radius:7px;background:transparent;color:inherit;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}
    .builder-mini.active{background:#222;color:#fff;border-color:#222}.builder-mini:disabled{opacity:.3;cursor:not-allowed}
    .builder-canvas-wrap{padding:18px;overflow:auto;flex:1}
    .builder-canvas{width:100%;max-width:980px;margin:auto;background:#fff;min-height:620px;border:1px solid #ddd;border-radius:10px;overflow:hidden;transition:max-width .2s ease}
    .builder-canvas.tablet{max-width:720px}.builder-canvas.mobile{max-width:390px}
    .builder-empty{padding:80px 24px;text-align:center;opacity:.45;font-size:14px}
    .page-block{position:relative;padding:28px;border-bottom:1px solid #eee;cursor:pointer;transition:outline .1s ease}
    .page-block.selected{outline:2px solid #6f8cff;outline-offset:-2px}.page-block.dragging{opacity:.35}
    .page-block-tools{position:absolute;right:8px;top:8px;display:flex;gap:4px;opacity:0;transition:opacity .12s}.page-block:hover .page-block-tools,.page-block.selected .page-block-tools{opacity:1}
    .block-tool{border:1px solid #ccc;background:#fff;color:#222;border-radius:6px;padding:4px 7px;cursor:pointer;font-size:11px}
    .block-title{font-family:Georgia,serif;font-size:30px;margin:0 0 10px}.block-text{margin:0;line-height:1.6;opacity:.75}
    .block-image-placeholder{min-height:220px;border-radius:8px;background:linear-gradient(135deg,#ece7e1,#d9d1c8);display:grid;place-items:center;color:#6d6259}
    .block-button-demo{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:999px;background:#222;color:#fff;font-weight:700;font-size:13px}
    .block-divider{height:1px;background:#ddd}.block-spacer{height:90px}
    .block-widget-frame{display:block;width:100%;height:100%;min-height:420px;border:0;border-radius:10px;background:#191919;box-sizing:border-box}
    .inspector-field{margin-bottom:14px}.inspector-field label{font-size:12px}.inspector-field textarea,.inspector-field select{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px;background:transparent;color:inherit;font:inherit}.inspector-field textarea{min-height:100px;resize:vertical}
    .builder-note{font-size:12px;line-height:1.5;opacity:.55}.builder-danger{color:#b34a4a}
    @media(prefers-color-scheme:dark){
      .builder-shell,.builder-toolbar,.builder-canvas{background:#191919;border-color:#444}.builder-panel{border-color:#444}.builder-main{background:#111}
      .builder-page:hover,.builder-block:hover{background:#242424}.builder-page.active{background:#302a2f}.builder-block{background:#202020;border-color:#444}
      .builder-toolbar{border-color:#444}.builder-mini{border-color:#555}.builder-mini.active{background:#fff;color:#191919;border-color:#fff}
      .page-block{border-color:#333}.block-tool{background:#242424;color:#fff;border-color:#555}.block-divider{background:#444}
      .inspector-field textarea,.inspector-field select{border-color:#555}
    }
    @media(max-width:1100px){.builder-shell{grid-template-columns:150px 190px minmax(320px,1fr)}.builder-inspector{grid-column:1/-1;border-left:0!important;border-top:1px solid #ddd}.builder-shell{min-height:auto}}
    @media(max-width:760px){.builder-shell{display:block}.builder-panel{border-right:0;border-bottom:1px solid #ddd}.builder-main{min-height:600px}}

    /* PAGE BUILDER V2 - full workspace */
    .builder-menu-frame{height:72px;border-radius:0;background:#191919}
    body.builder-mode{padding:0;overflow:hidden}
    body.builder-mode>.container{max-width:none;width:100%;height:100vh;margin:0}
    body.builder-mode>.container>h1,
    body.builder-mode>.container>.subtitle,
    body.builder-mode>.container>.tabs,
    body.builder-mode>.container>.library,
    body.builder-mode #button-tool,
    body.builder-mode #notebook-tool{display:none!important}
    body.builder-mode #page-builder-tool{display:block!important;height:100vh}
    body.builder-mode .builder-shell{height:100vh;min-height:0;border:0;border-radius:0;grid-template-columns:220px 270px minmax(520px,1fr) 280px}
    body.builder-mode .builder-panel{padding:18px;overflow:auto}
    body.builder-mode .builder-main{min-height:0}
    body.builder-mode .builder-canvas-wrap{padding:20px;overflow:auto}
    body.builder-mode .builder-canvas{max-width:1200px;min-height:calc(100vh - 82px)}
    .builder-section-spacer{height:28px}
    .builder-create-links{display:flex;flex-direction:column;gap:7px}
    .builder-create-link{appearance:none;width:100%;border:1px solid #ddd;border-radius:8px;background:transparent;color:inherit;text-align:left;padding:10px;font:inherit;font-size:13px;cursor:pointer}
    .builder-create-link:hover{background:#f5f5f5}
    .builder-saved-widgets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .builder-saved-widget{min-width:0;border:1px solid #ddd;border-radius:9px;padding:7px;background:transparent;color:inherit;cursor:grab;text-align:left}
    .builder-saved-widget:active{cursor:grabbing}
    .builder-saved-widget img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;border-radius:6px;background:#eee}
    .builder-saved-widget .widget-placeholder{height:70px;display:grid;place-items:center;font-size:24px}
    .builder-saved-widget-name{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px;opacity:.7}
    .builder-drop-ready{outline:2px dashed #6f8cff;outline-offset:-8px}
    @media(prefers-color-scheme:dark){
      .builder-create-link,.builder-saved-widget{border-color:#444}
      .builder-create-link:hover{background:#242424}
      .builder-saved-widget img{background:#242424}
    }
    @media(max-width:1250px){
      body.builder-mode .builder-shell{grid-template-columns:190px 230px minmax(430px,1fr) 240px}
    }

    /* TAB - distraction-free full-screen page check */
    body.builder-mode.builder-focus-mode .builder-shell{display:block!important;height:100vh!important}
    body.builder-mode.builder-focus-mode .builder-panel,
    body.builder-mode.builder-focus-mode .builder-toolbar{display:none!important}
    body.builder-mode.builder-focus-mode .builder-main{display:block!important;width:100vw!important;height:100vh!important;background:#191919!important}
    body.builder-mode.builder-focus-mode .builder-canvas-wrap{padding:0!important;overflow:auto!important;width:100vw!important;height:100vh!important}
    body.builder-mode.builder-focus-mode .builder-canvas{
      width:100vw!important;max-width:none!important;min-height:100vh!important;
      margin:0!important;border:0!important;border-radius:0!important
    }
    body.builder-mode.builder-focus-mode .builder-grid{width:100%!important}
    body.builder-mode.builder-focus-mode .page-block-tools,
    body.builder-mode.builder-focus-mode .builder-resize-handle,
    body.builder-mode.builder-focus-mode .builder-size-readout,
    body.builder-mode.builder-focus-mode .builder-insert-zone{display:none!important}
    body.builder-mode.builder-focus-mode .page-block.selected{outline:0!important}
    body.builder-mode.builder-focus-mode .page-block{cursor:default!important}

    /* CLEAN PREVIEW MODE */
    body.builder-preview-mode{margin:0;padding:0;background:#191919;overflow:auto}
    body.builder-preview-mode>.container{max-width:none;width:100%;margin:0}
    body.builder-preview-mode>.container>h1,
    body.builder-preview-mode>.container>.subtitle,
    body.builder-preview-mode>.container>.tabs,
    body.builder-preview-mode>.container>.library,
    body.builder-preview-mode #button-tool,
    body.builder-preview-mode #notebook-tool,
    body.builder-preview-mode #page-builder-tool{display:none!important}
    .site-preview{min-height:100vh;background:#191919;color:#f5f5f5}
    .site-preview-inner{width:100%;max-width:1440px;margin:0 auto;padding:0;box-sizing:border-box}
    .site-preview-grid{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:6px;align-items:start}
    .site-preview-block{grid-column:span var(--builder-span,24);min-width:0;min-height:1px;height:var(--builder-height,auto);box-sizing:border-box;position:relative;overflow:visible}
    .site-preview-block:not(:has(.block-widget-frame)){padding:24px}
    .site-preview-block .block-widget-frame{display:block;width:100%;height:100%;min-height:420px;border:0;background:#191919}
    .site-preview-block[style*="--builder-height:"] .block-widget-frame{min-height:0;height:100%}
    @media(max-width:600px){.site-preview-block{grid-column:1/-1!important}}

    /* PAGE BUILDER V4 - 24-column grid and live 8-way resizing */
    .builder-canvas{padding:12px;box-sizing:border-box;overflow:visible}
    .builder-grid{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:6px;align-items:start}
    .page-block{grid-column:span var(--builder-span,24);min-width:0;min-height:48px;height:var(--builder-height,auto);border:1px solid transparent;border-radius:8px;border-bottom:0;padding:24px;box-sizing:border-box;position:relative;overflow:visible;transform:translate(var(--builder-offset-x,0px),var(--builder-offset-y,0px))}
    .page-block:hover{border-color:#ddd}.page-block.selected{border-color:#6f8cff;box-shadow:0 0 0 1px rgba(111,140,255,.22)}
    .page-block.resizing{user-select:none;transition:none!important}
    .page-block.resizing iframe{pointer-events:none}
    .page-block[style*="--builder-height:"] .block-widget-frame{min-height:0;height:100%}
    .page-block:has(.block-widget-frame){padding:0}
    .page-block:has(.block-widget-frame)>.block-widget-frame{border-radius:8px}
    .page-block:has(.block-widget-frame)>.builder-size-readout{right:12px;bottom:10px}
    .builder-insert-zone{grid-column:1/-1;height:12px;border-radius:999px;position:relative;transition:.12s ease}
    .builder-insert-zone::after{content:"";position:absolute;left:8px;right:8px;top:5px;height:2px;background:transparent;border-radius:999px}
    .builder-insert-zone.active{height:28px;background:rgba(111,140,255,.08)}
    .builder-insert-zone.active::after{background:#6f8cff}
    .builder-resize-handle{position:absolute;z-index:20;display:none;touch-action:none}
    .page-block.selected .builder-resize-handle{display:block}
    .builder-resize-handle[data-dir="n"],.builder-resize-handle[data-dir="s"]{left:18px;right:18px;height:10px;cursor:ns-resize}
    .builder-resize-handle[data-dir="n"]{top:-5px}.builder-resize-handle[data-dir="s"]{bottom:-5px}
    .builder-resize-handle[data-dir="e"],.builder-resize-handle[data-dir="w"]{top:18px;bottom:18px;width:10px;cursor:ew-resize}
    .builder-resize-handle[data-dir="e"]{right:-5px}.builder-resize-handle[data-dir="w"]{left:-5px}
    .builder-resize-handle[data-dir="ne"],.builder-resize-handle[data-dir="nw"],.builder-resize-handle[data-dir="se"],.builder-resize-handle[data-dir="sw"]{width:14px;height:14px;border:2px solid #6f8cff;background:#191919;border-radius:3px}
    .builder-resize-handle[data-dir="ne"]{right:-7px;top:-7px;cursor:nesw-resize}.builder-resize-handle[data-dir="nw"]{left:-7px;top:-7px;cursor:nwse-resize}
    .builder-resize-handle[data-dir="se"]{right:-7px;bottom:-7px;cursor:nwse-resize}.builder-resize-handle[data-dir="sw"]{left:-7px;bottom:-7px;cursor:nesw-resize}
    .builder-resize-handle[data-dir="n"]::after,.builder-resize-handle[data-dir="s"]::after{content:"";position:absolute;left:50%;width:34px;height:2px;transform:translateX(-50%);background:#6f8cff;border-radius:2px;top:4px}
    .builder-resize-handle[data-dir="e"]::after,.builder-resize-handle[data-dir="w"]::after{content:"";position:absolute;top:50%;height:34px;width:2px;transform:translateY(-50%);background:#6f8cff;border-radius:2px;left:4px}
    .builder-size-readout{position:absolute;right:10px;bottom:8px;font-size:10px;padding:4px 7px;border-radius:999px;background:#6f8cff;color:#fff;display:none;z-index:21;pointer-events:none}
    .page-block.resizing .builder-size-readout{display:block}
    .builder-width-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
    .builder-width-btn{appearance:none;border:1px solid #ccc;border-radius:7px;background:transparent;color:inherit;padding:7px 4px;font:inherit;font-size:11px;cursor:pointer}
    .builder-width-btn.active{background:#222;color:#fff;border-color:#222}
    .builder-height-row{display:flex;gap:6px;margin-top:7px}.builder-height-row input{min-width:0;flex:1;padding:7px;border:1px solid #ccc;border-radius:7px;background:transparent;color:inherit}
    /* Fluid typography/content inside native Page Builder blocks */
    .page-block{container-type:inline-size}
    .page-block .block-title{font-size:clamp(18px,5.2cqw,30px);line-height:1.08;overflow-wrap:anywhere}
    .page-block .block-text{font-size:clamp(10px,1.9cqw,15px);line-height:clamp(1.35,1.2 + .5cqw,1.6);overflow-wrap:anywhere}
    .page-block .block-button-demo{font-size:clamp(10px,1.6cqw,13px);padding:clamp(7px,1.4cqw,10px) clamp(10px,2.2cqw,16px)}
    @container (max-width:360px){.block-title{margin-bottom:7px}.block-text{line-height:1.45}}
    .builder-canvas.mobile .page-block{grid-column:1/-1!important}
    @media(prefers-color-scheme:dark){
      .page-block:hover{border-color:#444}.page-block.selected{border-color:#6f8cff}
      .builder-width-btn{border-color:#555}.builder-width-btn.active{background:#fff;color:#191919;border-color:#fff}
      .builder-height-row input{border-color:#555}.builder-resize-handle[data-dir="ne"],.builder-resize-handle[data-dir="nw"],.builder-resize-handle[data-dir="se"],.builder-resize-handle[data-dir="sw"]{background:#191919}
    }

  </style>
</head>

  <script>

    const STORAGE_KEY =
      "myWebsiteWidgets";

    const URL_PARAMS = new URLSearchParams(window.location.search);
    const EDITOR_QUERY = URL_PARAMS.get("editor");
    const PREVIEW_MODE = URL_PARAMS.get("preview") === "1";
    if (PREVIEW_MODE) {
      document.body.classList.add("builder-preview-mode");
      document.querySelectorAll("body > .container").forEach(el=>el.style.display="none");
    }
    else if (!EDITOR_QUERY || EDITOR_QUERY === "page-builder") document.body.classList.add("builder-mode");

    const MAX_NOTEBOOK_PAGES =
      200;


    /* ===================================== */
    /* TABS                                  */
    /* ===================================== */

    const tabButtons =
      document.querySelectorAll(
        ".tab-button"
      );

    const tabContents =
      document.querySelectorAll(
        ".tab-content"
      );


    function openTab(
      target
    ) {

      tabButtons.forEach(
        function (button) {

          button.classList.toggle(
            "active",
            button.dataset.tab === target
          );

        }
      );


      tabContents.forEach(
        function (content) {

          content.classList.toggle(
            "active",
            content.id === target
          );

        }
      );

    }


    tabButtons.forEach(
      function (button) {

        button.addEventListener(
          "click",
          function () {

            openTab(
              button.dataset.tab
            );

          }
        );

      }
    );

    // editor.html is the dedicated Page Builder entry point.
    // Force the builder tab active so legacy widget tabs never cover it.
    if (!PREVIEW_MODE && (!EDITOR_QUERY || EDITOR_QUERY === "page-builder")) {
      openTab("page-builder-tool");
    }


    /* ===================================== */
    /* STORAGE                               */
    /* ===================================== */

    function getWidgets() {

      try {

        const saved =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!saved) {
          return [];
        }


        const widgets =
          JSON.parse(saved);


        return Array.isArray(widgets)
          ? widgets
          : [];

      }
      catch (error) {

        return [];

      }

    }


    function saveWidgets(
      widgets
    ) {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(widgets)
      );

    }


    function addWidget(
      widget
    ) {

      const widgets =
        getWidgets();


      widgets.push(
        widget
      );


      saveWidgets(
        widgets
      );


      renderWidgets();

    }


    function replaceWidget(
      index,
      widget
    ) {

      const widgets =
        getWidgets();


      if (
        index < 0 ||
        index >= widgets.length
      ) {
        return false;
      }


      widgets[index] =
        widget;


      saveWidgets(
        widgets
      );


      renderWidgets();


      return true;

    }


    function deleteWidget(
      index
    ) {

      const widgets =
        getWidgets();


      const widget =
        widgets[index];


      if (!widget) {
        return;
      }


      const widgetName =
        widget.name ||
        (
          widget.type === "notebook"
            ? "Notebook"
            : "Button"
        );


      const confirmed =
        window.confirm(
          "Удалить «" +
          widgetName +
          "» из My Widgets?

" +
          "Сам виджет и файлы на GitHub удалены не будут."
        );


      if (!confirmed) {
        return;
      }


      widgets.splice(
        index,
        1
      );


      saveWidgets(
        widgets
      );


      /*
        Если удалили именно тот блокнот,
        который сейчас редактируется,
        выходим из режима редактирования.
      */

      if (
        editingNotebookIndex === index
      ) {

        exitEditMode();

      }
      else if (
        editingNotebookIndex !== null &&
        index < editingNotebookIndex
      ) {

        editingNotebookIndex--;

      }


      renderWidgets();

    }


    /* ===================================== */
    /* PATH HELPERS                          */
    /* ===================================== */

    function cleanPath(
      path
    ) {

      return path
        .trim()
        .replace(
          /^\/+/,
          ""
        );

    }


    function normalizeFolder(
      folder
    ) {

      folder =
        cleanPath(folder);


      if (
        folder &&
        !folder.endsWith("/")
      ) {

        folder += "/";

      }


      return folder;

    }


    function assetUrl(
      path
    ) {

      return new URL(
        cleanPath(path),
        window.location.href
      ).toString();

    }


    function formatPageNumber(
      number
    ) {

      return String(number)
        .padStart(
          2,
          "0"
        );

    }


    /* ===================================== */
    /* NOTEBOOK ELEMENTS                     */
    /* ===================================== */

    const notebookName =
      document.getElementById(
        "notebook-name"
      );

    const notebookFolder =
      document.getElementById(
        "notebook-folder"
      );

    const notebookPrefix =
      document.getElementById(
        "notebook-prefix"
      );

    const checkPagesButton =
      document.getElementById(
        "check-pages"
      );

    const createNotebookButton =
      document.getElementById(
        "create-notebook"
      );

    const clearNotebookButton =
      document.getElementById(
        "clear-notebook"
      );

    const pageCheckResult =
      document.getElementById(
        "page-check-result"
      );

    const pageCheckTitle =
      document.getElementById(
        "page-check-title"
      );

    const pageCheckList =
      document.getElementById(
        "page-check-list"
      );

    const pageCount =
      document.getElementById(
        "page-count"
      );

    const notebookResult =
      document.getElementById(
        "notebook-result"
      );

    const notebookUrl =
      document.getElementById(
        "notebook-url"
      );

    const notebookPreview =
      document.getElementById(
        "notebook-preview"
      );

    const copyNotebook =
      document.getElementById(
        "copy-notebook"
      );

    const saveNotebook =
      document.getElementById(
        "save-notebook"
      );

    const notebookMessage =
      document.getElementById(
        "notebook-message"
      );

    const editMode =
      document.getElementById(
        "edit-mode"
      );

    const editWidgetName =
      document.getElementById(
        "edit-widget-name"
      );


    let foundNotebookPages =
      [];

    let currentNotebookUrl =
      "";

    let currentNotebookCover =
      "";

    let editingNotebookIndex =
      null;


    /* ===================================== */
    /* RESET CHECK                           */
    /* ===================================== */

    function resetNotebookCheck() {

      foundNotebookPages =
        [];

      currentNotebookUrl =
        "";

      currentNotebookCover =
        "";


      createNotebookButton.disabled =
        true;


      pageCheckResult
        .classList
        .remove("visible");


      pageCheckList.innerHTML =
        "";

      pageCount.textContent =
        "";


      notebookResult
        .classList
        .remove("visible");


      notebookUrl.textContent =
        "";

      notebookPreview.src =
        "";

    }


    notebookFolder.addEventListener(
      "input",
      resetNotebookCheck
    );


    notebookPrefix.addEventListener(
      "input",
      resetNotebookCheck
    );


    /* ===================================== */
    /* EDIT MODE                             */
    /* ===================================== */

    function exitEditMode() {

      editingNotebookIndex =
        null;


      editMode
        .classList
        .remove("visible");


      editWidgetName.textContent =
        "";


      createNotebookButton.textContent =
        "Создать блокнот";


      saveNotebook.textContent =
        "Сохранить?";

    }


    function getNotebookDataFromWidget(
      widget
    ) {

      let folder =
        widget.folder || "";

      let prefix =
        widget.prefix || "";


      /*
        Совместимость со старыми блокнотами.

        Если folder/prefix ещё не сохранялись,
        пытаемся получить их из:

        assets/notebooks/name/name_00.png
      */

      if (
        (!folder || !prefix) &&
        (
          widget.cover ||
          widget.preview
        )
      ) {

        const cover =
          cleanPath(
            widget.cover ||
            widget.preview
          );


        const slashIndex =
          cover.lastIndexOf("/");


        if (
          slashIndex !== -1
        ) {

          folder =
            cover.substring(
              0,
              slashIndex + 1
            );


          const filename =
            cover.substring(
              slashIndex + 1
            );


          prefix =
            filename.replace(
              /_00\.[^.]+$/i,
              ""
            );

        }

      }


      return {
        folder:
          normalizeFolder(folder),

        prefix:
          prefix
      };

    }


    async function editNotebook(
      index
    ) {

      const widgets =
        getWidgets();


      const widget =
        widgets[index];


      if (
        !widget ||
        widget.type !== "notebook"
      ) {
        return;
      }


      const data =
        getNotebookDataFromWidget(
          widget
        );


      if (
        !data.folder ||
        !data.prefix
      ) {

        alert(
          "Не удалось определить папку или префикс этого старого блокнота."
        );

        return;

      }


      editingNotebookIndex =
        index;


      openTab(
        "notebook-tool"
      );


      notebookName.value =
        widget.name || "";


      notebookFolder.value =
        data.folder;


      notebookPrefix.value =
        data.prefix;


      resetNotebookCheck();


      /*
        resetNotebookCheck не должен
        отменять сам режим Edit.
      */

      editingNotebookIndex =
        index;


      editWidgetName.textContent =
        widget.name ||
        data.prefix;


      editMode
        .classList
        .add("visible");


      createNotebookButton.textContent =
        "Обновить блокнот";


      saveNotebook.textContent =
        "Сохранить изменения";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });


      /*
        Автоматически запускаем
        проверку страниц.
      */

      await checkNotebookPages();

    }


    /* ===================================== */
    /* FILE CHECK                            */
    /* ===================================== */

    async function fileExists(
      path
    ) {

      try {

        const response =
          await fetch(
            assetUrl(path),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        return response.ok;

      }
      catch (error) {

        return false;

      }

    }


    /* ===================================== */
    /* CHECK PAGES                           */
    /* ===================================== */

    async function checkNotebookPages() {

      const folder =
        normalizeFolder(
          notebookFolder.value
        );


      const prefix =
        notebookPrefix
          .value
          .trim();


      if (!folder) {

        alert(
          "Укажи папку блокнота."
        );

        return;

      }


      if (!prefix) {

        alert(
          "Укажи префикс файлов."
        );

        return;

      }


      resetNotebookCheck();


      checkPagesButton.disabled =
        true;


      checkPagesButton.textContent =
        "Проверяю...";


      pageCheckResult
        .classList
        .add("visible");


      pageCheckTitle.textContent =
        "Проверка страниц...";


      currentNotebookCover =
        folder +
        prefix +
        "_00.png";


      const pages =
        [];


      let firstMissingPath =
        "";


      for (
        let page = 1;
        page <= MAX_NOTEBOOK_PAGES;
        page++
      ) {

        const filename =
          prefix +
          "_" +
          formatPageNumber(page) +
          ".png";


        const path =
          folder +
          filename;


        const exists =
          await fileExists(path);


        if (!exists) {

          firstMissingPath =
            path;

          break;

        }


        pages.push(
          path
        );


        const line =
          document.createElement(
            "div"
          );


        line.className =
          "page-found";


        line.textContent =
          "✓ " +
          filename;


        pageCheckList.appendChild(
          line
        );

      }


      foundNotebookPages =
        pages;


      if (firstMissingPath) {

        const missingLine =
          document.createElement(
            "div"
          );


        missingLine.className =
          "page-missing";


        missingLine.textContent =
          "✕ " +
          firstMissingPath
            .split("/")
            .pop() +
          " - не найден";


        pageCheckList.appendChild(
          missingLine
        );

      }


      if (
        foundNotebookPages.length > 0
      ) {

        pageCheckTitle.textContent =
          "Страницы найдены ✓";


        pageCount.textContent =
          "Найдено страниц: " +
          foundNotebookPages.length;


        createNotebookButton.disabled =
          false;

      }
      else {

        pageCheckTitle.textContent =
          "Страницы не найдены";


        pageCount.textContent =
          "Файл _01.png не найден. Проверь папку и префикс.";


        createNotebookButton.disabled =
          true;

      }


      checkPagesButton.disabled =
        false;


      checkPagesButton.textContent =
        "Проверить страницы";

    }


    checkPagesButton.addEventListener(
      "click",
      checkNotebookPages
    );


    /* ===================================== */
    /* BUILD NOTEBOOK URL                    */
    /* ===================================== */

    function buildNotebookUrl() {

      if (
        foundNotebookPages.length === 0
      ) {

        }else{
          const recovery=localStorage.getItem(PAGE_BUILDER_KEY+":recovery");

      host.querySelectorAll("[data-folder-name]").forEach(x=>x.ondblclick=e=>{e.stopPropagation();x.contentEditable="true";x.focus();x.onblur=()=>{const g=folders.find(g=>g.id===x.dataset.folderName);g.name=x.textContent.trim()||"Папка";builderRenderLayers()};x.onkeydown=ev=>{if(ev.key==="Enter"){ev.preventDefault();x.blur()}}});
      host.querySelectorAll("[data-folder-drop]").forEach(box=>{box.ondragover=e=>{if(e.dataTransfer.types.includes("application/x-yanisky-layer")){e.preventDefault();box.style.background="rgba(111,140,255,.08)"}};box.ondragleave=()=>box.style.background="";box.ondrop=e=>{e.preventDefault();box.style.background="";const id=e.dataTransfer.getData("application/x-yanisky-layer");if(!id)return;folders.forEach(g=>g.children=(g.children||[]).filter(x=>x!==id));const g=folders.find(g=>g.id===box.dataset.folderDrop);g.children=g.children||[];g.children.push(id);builderRenderLayers()}});
      host.ondragover=e=>{if(e.dataTransfer.types.includes("application/x-yanisky-layer"))e.preventDefault()};host.ondrop=e=>{if(e.target.closest("[data-folder-drop]"))return;const id=e.dataTransfer.getData("application/x-yanisky-layer");if(!id)return;e.preventDefault();folders.forEach(g=>g.children=(g.children||[]).filter(x=>x!==id));const from=p.blocks.findIndex(b=>b.id===id);const targetEl=e.target.closest("[data-layer-id]");const target=targetEl?p.blocks.findIndex(b=>b.id===targetEl.dataset.layerId):p.blocks.length-1;if(from>=0&&target>=0&&from!==target){const [m]=p.blocks.splice(from,1);p.blocks.splice(target,0,m)}builderRender()}
    }

    function builderBlockMarkup(b){
      if(b.type==="text")return '<h3 class="block-title">'+builderEsc(b.title||"Заголовок")+'</h3><p class="block-text">'+builderEsc(b.text||"Текст блока")+'</p>';
      if(b.type==="image")return '<div class="block-image-placeholder">'+builderEsc(b.title||"Изображение")+'</div>';
      if(b.type==="button")return '<h3 class="block-title">'+builderEsc(b.title||"Кнопка")+'</h3><span class="block-button-demo">'+builderEsc(b.text||"Открыть")+'</span>';
      if(b.type==="site-menu")return '<iframe class="block-widget-frame builder-menu-frame" src="./menu/" title="Меню сайта"></iframe>';
      if(b.type==="divider")return '<div class="block-divider"></div>';
      if(b.type==="spacer")return '<div class="block-spacer"></div>';
      if(b.type==="price-calculator")return '<iframe class="block-widget-frame" src="./price-calculator/" title="Калькулятор стоимости" scrolling="no"></iframe>';
      if(b.type==="saved-widget" && b.url)return '<iframe class="block-widget-frame" src="'+builderEsc(b.url)+'" title="'+builderEsc(b.title||"Widget")+'" scrolling="no"></iframe>';
      return '<p class="block-text">Блок</p>';
    }

    function builderSpan(block){
      if(block.gridVersion!==24){
        const old=Number(block.span||12);
        block.span=Math.max(2,Math.min(24,old<=12?old*2:old));
        block.gridVersion=24;
      }
      return Math.max(2,Math.min(24,Number(block.span||24)));
    }
    function builderSetSpan(block,span){block.span=Math.max(2,Math.min(24,Number(span)));block.gridVersion=24;builderRenderCanvas();builderRenderInspector();builderHistoryCommit()}
    function builderHeight(block){return block.height?Math.max(48,Number(block.height)):null}

    function builderRenderCanvas(){
      const canvas=document.getElementById("builder-canvas"); if(!canvas)return;
      const page=builderPage(); builderNormalizeLayers(); canvas.innerHTML="";
      const grid=document.createElement("div");grid.className="builder-grid";canvas.appendChild(grid);

      function zone(index){
        const z=document.createElement("div");z.className="builder-insert-zone";z.dataset.index=index;
        z.ondragover=e=>{e.preventDefault();e.stopPropagation();z.classList.add("active")};
        z.ondragleave=()=>z.classList.remove("active");
        z.ondrop=e=>{
          e.preventDefault();e.stopPropagation();z.classList.remove("active");
          const raw=e.dataTransfer.getData("application/json");
          if(raw){try{const data=JSON.parse(raw);if(data.kind==="widget"){builderInsertWidget(data.widget,index);return}if(data.kind==="block"){builderInsertBlock(data.type,index);return}}catch(err){}}
          const from=e.dataTransfer.getData("text/plain");if(!from)return;
          const old=page.blocks.findIndex(x=>x.id===from);if(old<0)return;
          const [m]=page.blocks.splice(old,1);let target=index;if(old<index)target--;page.blocks.splice(Math.max(0,target),0,m);builderRenderCanvas();
        };
        return z;
      }

      if(!page.blocks.length){
        const empty=document.createElement("div");empty.className="builder-empty";empty.style.gridColumn="1/-1";empty.innerHTML="Страница пока пустая.<br>Добавь первый блок слева или перетащи сюда виджет.";
        empty.ondragover=e=>{e.preventDefault();empty.classList.add("builder-drop-ready")};
        empty.ondrop=e=>{const raw=e.dataTransfer.getData("application/json");if(raw){e.preventDefault();try{const data=JSON.parse(raw);if(data.kind==="widget")builderInsertWidget(data.widget,0);if(data.kind==="block")builderInsertBlock(data.type,0)}catch(err){}}};
        grid.appendChild(empty);return;
      }

      grid.appendChild(zone(0));
      page.blocks.forEach((block,i)=>{
        const span=builderSpan(block),height=builderHeight(block);
      builderNormalizeLayers();
        const el=document.createElement("div");el.className="page-block"+(builderSelected===block.id?" selected":"")+(block.visible===false?" builder-hidden":"")+(block.locked?" builder-locked":"");el.draggable=!block.locked;el.dataset.id=block.id;el.style.opacity=Math.max(0,Math.min(100,Number(block.opacity??100)))/100;
        el.style.setProperty("--builder-span",span);el.style.setProperty("--builder-height",height?height+"px":"auto");
        const handles=["n","ne","e","se","s","sw","w","nw"].map(d=>'<div class="builder-resize-handle" data-dir="'+d+'" title="Изменить размер"></div>').join("");
        el.innerHTML='<div class="page-block-tools"><button class="block-tool" data-up="'+i+'" type="button">↑</button><button class="block-tool" data-down="'+i+'" type="button">↓</button><button class="block-tool builder-danger" data-delete="'+block.id+'" type="button">×</button></div>'+builderBlockMarkup(block)+handles+'<div class="builder-size-readout">'+Math.round(span/24*100)+'% × '+(height?height+"px":"auto")+'</div>';
        el.onclick=e=>{if(e.target.closest(".page-block-tools")||e.target.closest(".builder-resize-handle"))return;builderSelected=block.id;builderSelectedFolder=null;builderRenderCanvas();builderRenderLayers();builderRenderInspector()};
        el.oncontextmenu=e=>{
          e.preventDefault();builderSelected=block.id;builderSelectedFolder=null;builderRenderCanvas();builderRenderLayers();builderRenderInspector();
          document.querySelector(".builder-context-menu")?.remove();
          const m=document.createElement("div");m.className="builder-context-menu";m.style.cssText="position:fixed;z-index:99999;left:"+e.clientX+"px;top:"+e.clientY+"px;background:#171717;color:#fff;border:1px solid #444;border-radius:8px;padding:6px;min-width:160px;box-shadow:0 12px 30px rgba(0,0,0,.35)";
          [["Копировать",()=>builderCopySelection(false)],["Вырезать",()=>builderCopySelection(true)],["Вставить",()=>builderPaste()],["Дублировать",()=>builderDuplicateBlock(block.id)],["Удалить",()=>builderDeleteBlock(block.id)]].forEach(([label,fn])=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.style.cssText="display:block;width:100%;padding:8px 10px;border:0;background:transparent;color:#fff;text-align:left;cursor:pointer";b.onmouseenter=()=>b.style.background="#303030";b.onmouseleave=()=>b.style.background="transparent";b.onclick=()=>{m.remove();fn()};m.appendChild(b)});
          document.body.appendChild(m);const close=ev=>{if(!m.contains(ev.target)){m.remove();document.removeEventListener("pointerdown",close,true)}};setTimeout(()=>document.addEventListener("pointerdown",close,true),0);
        };
        el.ondragstart=e=>{if(block.locked){e.preventDefault();return}if(el.classList.contains("resizing")){e.preventDefault();return}el.classList.add("dragging");e.dataTransfer.setData("text/plain",block.id)};
        el.ondragend=()=>el.classList.remove("dragging");

        el.querySelectorAll(".builder-resize-handle").forEach(handle=>{
          handle.onpointerdown=e=>{
            if(block.locked)return;
            e.preventDefault();e.stopPropagation();builderSelected=block.id;el.draggable=false;el.classList.add("selected","resizing");
            handle.setPointerCapture(e.pointerId);
            const dir=handle.dataset.dir,gridRect=grid.getBoundingClientRect(),startX=e.clientX,startY=e.clientY,startSpan=builderSpan(block),startHeight=el.getBoundingClientRect().height;
            const col=gridRect.width/24;
            const move=ev=>{
              const dx=ev.clientX-startX,dy=ev.clientY-startY;
              let nextSpan=startSpan,nextHeight=startHeight,offsetX=0,offsetY=0;
              if(dir.includes("e"))nextSpan=Math.round(startSpan+dx/col);
              if(dir.includes("w"))nextSpan=Math.round(startSpan-dx/col);
              if(dir.includes("s"))nextHeight=Math.round(startHeight+dy);
              if(dir.includes("n"))nextHeight=Math.round(startHeight-dy);
              nextSpan=Math.max(2,Math.min(24,nextSpan));nextHeight=Math.max(48,nextHeight);
              block.span=nextSpan;block.gridVersion=24;
              if(dir.includes("n")||dir.includes("s"))block.height=nextHeight;

              // CSS Grid normally anchors the block at top-left. For west/north
              // resizing, translate the live preview by exactly the change in
              // size so the right/bottom edge stays fixed under the cursor.
              if(dir.includes("w"))offsetX=(startSpan-nextSpan)*col;
              if(dir.includes("n"))offsetY=startHeight-nextHeight;

              el.style.setProperty("--builder-span",nextSpan);
              el.style.setProperty("--builder-offset-x",offsetX+"px");
              el.style.setProperty("--builder-offset-y",offsetY+"px");
              if(block.height)el.style.setProperty("--builder-height",block.height+"px");
              el.querySelector(".builder-size-readout").textContent=Math.round(nextSpan/24*100)+"% × "+(block.height?block.height+"px":"auto");
            };
            const finish=ev=>{
              try{handle.releasePointerCapture(ev.pointerId)}catch(err){}
              handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",finish);handle.removeEventListener("pointercancel",finish);
              el.draggable=true;el.classList.remove("resizing");
              // Re-render after release so temporary north/west preview offsets
              // are cleared and the grid commits the new dimensions cleanly.
              builderRenderCanvas();builderRenderInspector();
            };
            handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",finish);handle.addEventListener("pointercancel",finish);
          };
        });
        grid.appendChild(el);grid.appendChild(zone(i+1));
      });

      grid.querySelectorAll("[data-delete]").forEach(x=>x.onclick=()=>builderDeleteBlock(x.dataset.delete));
      grid.querySelectorAll("[data-up]").forEach(x=>x.onclick=()=>{const i=+x.dataset.up;if(i>0){[page.blocks[i-1],page.blocks[i]]=[page.blocks[i],page.blocks[i-1]];builderRenderCanvas();builderRenderLayers()}});
      grid.querySelectorAll("[data-down]").forEach(x=>x.onclick=()=>{const i=+x.dataset.down;if(i<page.blocks.length-1){[page.blocks[i+1],page.blocks[i]]=[page.blocks[i],page.blocks[i+1]];builderRenderCanvas()}});
    }

    function builderRenderInspector(){
      const host=document.getElementById("builder-inspector"); if(!host)return;
      const block=builderPage().blocks.find(x=>x.id===builderSelected);
      if(!block){host.innerHTML='<p class="builder-note">Выбери блок на странице, чтобы изменить его.</p>';return}
      const layerHtml='<div class="inspector-field"><label>Прозрачность</label><div class="builder-opacity-row"><input id="builder-opacity" type="range" min="0" max="100" value="'+(block.opacity??100)+'"><span id="builder-opacity-value">'+(block.opacity??100)+'%</span></div></div><div class="inspector-field"><label>Видимость по устройствам</label><div class="builder-width-options">'+["desktop","tablet","mobile"].map(d=>'<button type="button" class="builder-width-btn'+(block.deviceVisibility?.[d]!==false?" active":"")+'" data-device-visible="'+d+'">'+({desktop:"Desktop",tablet:"Tablet",mobile:"Mobile"})[d]+'</button>').join("")+'</div></div>';
      const span=builderSpan(block),height=builderHeight(block);
      const widthHtml='<div class="inspector-field"><label>Ширина блока</label><div class="builder-width-options">'+[[6,"25%"],[8,"33%"],[12,"50%"],[16,"66%"],[18,"75%"],[24,"100%"]].map(([s,l])=>'<button type="button" class="builder-width-btn'+(span===s?" active":"")+'" data-span="'+s+'">'+l+'</button>').join("")+'</div><p class="builder-note">Сетка теперь состоит из 24 сегментов. За края можно менять одну сторону, за уголки - ширину и высоту одновременно.</p></div><div class="inspector-field"><label>Высота блока</label><div class="builder-height-row"><input id="builder-height-input" type="number" min="48" step="1" value="'+(height||"")+'" placeholder="Авто"><button class="builder-mini" id="builder-height-auto" type="button">Авто</button></div></div>';
      let body="";
      if(["divider","spacer","price-calculator","saved-widget","site-menu"].includes(block.type)){
        const name=block.type==="price-calculator"?"Калькулятор стоимости":block.type==="saved-widget"?(block.title||"Сохранённый виджет"):block.type==="site-menu"?"Переключение страниц":block.type==="divider"?"Разделитель":"Пустое пространство";
        body='<p><strong>'+builderEsc(name)+'</strong></p>';
      }else{
        body='<div class="inspector-field"><label>Заголовок</label><textarea id="builder-edit-title">'+builderEsc(block.title||"")+'</textarea></div><div class="inspector-field"><label>'+(block.type==="button"?"Текст кнопки":"Текст")+'</label><textarea id="builder-edit-text">'+builderEsc(block.text||"")+'</textarea></div>';
      }
      host.innerHTML=body+layerHtml+widthHtml;
      host.querySelectorAll("[data-span]").forEach(btn=>btn.onclick=()=>builderSetSpan(block,+btn.dataset.span));
      const op=document.getElementById("builder-opacity");if(op)op.oninput=()=>{block.opacity=+op.value;document.getElementById("builder-opacity-value").textContent=op.value+"%";const el=document.querySelector('.page-block[data-id="'+block.id+'"]');if(el)el.style.opacity=op.value/100;builderRenderLayers()};
      host.querySelectorAll("[data-device-visible]").forEach(btn=>btn.onclick=()=>{block.deviceVisibility=block.deviceVisibility||{desktop:true,tablet:true,mobile:true};const d=btn.dataset.deviceVisible;block.deviceVisibility[d]=block.deviceVisibility[d]===false?true:false;btn.classList.toggle("active",block.deviceVisibility[d]!==false)});
      const hi=document.getElementById("builder-height-input");if(hi)hi.onchange=()=>{block.height=hi.value?Math.max(48,+hi.value):null;builderRenderCanvas();builderRenderInspector()};
      const ha=document.getElementById("builder-height-auto");if(ha)ha.onclick=()=>{block.height=null;builderRenderCanvas();builderRenderInspector()};
      const t=document.getElementById("builder-edit-title"),x=document.getElementById("builder-edit-text");
      if(t)t.oninput=()=>{block.title=t.value;builderRenderCanvas()};
      if(x)x.oninput=()=>{block.text=x.value;builderRenderCanvas()};
    }

      const all=[{type:"price-calculator",name:"Калькулятор стоимости",url:new URL("./price-calculator/",window.location.href).toString(),system:true},...widgets];

    function builderMakeBlock(type){

      canvas.ondrop=e=>{
        // Insert zones and the empty-state have their own drop handlers.
        // Do not let the canvas create a second copy of the same dragged block.

        const raw=e.dataTransfer.getData("application/json");if(!raw)return;
        e.preventDefault();e.stopPropagation();canvas.classList.remove("builder-drop-ready");
        try{const data=JSON.parse(raw);if(data.kind==="widget")builderInsertWidget(data.widget);else if(data.kind==="block")builderInsertBlock(data.type)}catch(err){}

    document.getElementById("builder-preview")?.addEventListener("pointerdown",()=>builderPersist());
    document.getElementById("builder-save")?.addEventListener("click",e=>{builderPersist();const old=e.target.textContent;e.target.textContent="Сохранено ✓";setTimeout(()=>e.target.textContent=old,1200)});
    document.getElementById("builder-publish")?.addEventListener("click",e=>builderPublish(e.currentTarget));
    document.addEventListener("keydown",e=>{
      if(!document.body.classList.contains("builder-mode")||PREVIEW_MODE)return;
      const tag=(e.target?.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea"||tag==="select"||e.target?.isContentEditable)return;
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"&&(builderSelected||builderSelectedFolder)){e.preventDefault();builderCopySelection(false);return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="x"&&(builderSelected||builderSelectedFolder)){e.preventDefault();builderCopySelection(true);return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="v"&&builderLoadClipboard()){e.preventDefault();builderPaste();return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();if(e.shiftKey)builderRedo();else builderUndo();return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){e.preventDefault();builderRedo();return}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"&&(builderSelected||builderSelectedFolder)){e.preventDefault();builderCopySelection(false);builderPaste()}
      if((e.key==="Delete"||e.key==="Backspace")&&builderSelected){e.preventDefault();builderDeleteBlock(builderSelected)}
   },true);;
    document.addEventListener("keydown",e=>{
      if(e.key!=="Tab" || PREVIEW_MODE)return;
      const tag=(e.target?.tagName||"").toLowerCase();
      if(tag==="input"||tag==="textarea"||tag==="select"||e.target?.isContentEditable)return;
      if(!document.body.classList.contains("builder-mode"))return;
      e.preventDefault();
      document.body.classList.toggle("builder-focus-mode");
      if(document.body.classList.contains("builder-focus-mode")){
        builderSelected=null;
        builderRenderCanvas();
      }
    });
    document.getElementById("builder-add-folder")?.addEventListener("click",()=>{
      const p=builderPage();p.folders=p.folders||[];const selected=builderSelectedBlock();
      p.folders.push({id:"g"+builderUid(),name:"Новая папка",collapsed:false,children:selected?[selected.id]:[]});
      if(selected)p.folders.slice(0,-1).forEach(g=>g.children=(g.children||[]).filter(id=>id!==selected.id));
      builderRenderLayers();builderHistoryCommit();
    });
    document.getElementById("builder-add-page")?.addEventListener("click",()=>{
      const name=prompt("Название новой страницы:");if(!name)return;const id=name.toLowerCase().trim().replace(/[^a-zа-я0-9]+/gi,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36).slice(-4);
      builderState.pages.push({id,name:name.trim().toUpperCase(),blocks:[],folders:[]});builderState.currentPage=id;builderSelected=null;builderRender();
    });
    const requestedPage=URL_PARAMS.get("page");
    if(requestedPage && builderState.pages.some(p=>p.id===requestedPage)) builderState.currentPage=requestedPage;
    if(PREVIEW_MODE) builderRenderPreview();
    else builderRender();


    /* ===================================== */
    /* START                                 */
    /* ===================================== */

    if (!PREVIEW_MODE && document.getElementById("widget-grid")) renderWidgets();



  </script>

</body>

</html>
