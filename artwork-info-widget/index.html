<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artwork Info Widget</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:#242424;font-family:Arial,sans-serif}
.widget{width:100%;padding:2px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#777;margin-bottom:8px}
h1{font-family:Georgia,serif;font-size:clamp(30px,4vw,52px);font-weight:400;line-height:1.05;margin:0 0 10px;color:#202020}
.year{font-size:14px;color:#777;margin-bottom:22px}
.facts{border-top:1px solid #cfcfc9;border-bottom:1px solid #cfcfc9;padding:7px 0}
.row{display:grid;grid-template-columns:minmax(92px,30%) 1fr;gap:14px;padding:7px 0;border-bottom:1px solid #e2e2dc;font-size:13px;line-height:1.45}
.row:last-child{border-bottom:0}
.row b{font-weight:400;color:#777}.row span{color:#333}
.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4e9a62;margin-right:8px}
.status.reserved:before{background:#bd9145}.status.sold:before{background:#888}
.state{min-height:180px;display:grid;place-items:center;padding:28px;text-align:center;border:1px dashed #bbb;color:#777;font-size:13px}
@media(max-width:520px){h1{font-size:32px}.row{grid-template-columns:90px 1fr}}
</style>
</head>
<body>
<div id="app" class="widget"><div class="state">Загрузка информации…</div></div>
<script>
const app=document.querySelector("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const params=new URLSearchParams(location.search),slug=params.get("slug")||"";
const lang=(params.get("lang")||"ru").toLowerCase()==="en"?"en":"ru";
const pick=v=>v&&typeof v==="object"&&!Array.isArray(v)?(v[lang]||v.ru||v.en||""):(v??"");
const statusLabels={ru:{available:"В наличии",reserved:"Зарезервировано",sold:"Продано"},en:{available:"Available",reserved:"Reserved",sold:"Sold"}};
const categoryLabels={ru:{traditional:"Традиционное искусство",digital:"Цифровое искусство",mixed_media:"Смешанные техники","mixed-media":"Смешанные техники"},en:{traditional:"Traditional",digital:"Digital",mixed_media:"Mixed media","mixed-media":"Mixed media"}};
const labels=lang==="en"?{status:"Status",size:"Dimensions",technique:"Technique",materials:"Materials",support:"Support",series:"Series",category:"Category",tags:"Tags"}:{status:"Статус",size:"Размер",technique:"Техника",materials:"Материалы",support:"Основа",series:"Серия",category:"Категория",tags:"Теги"};
function notifySize(){requestAnimationFrame(()=>parent.postMessage({type:"yanisky-widget-size",height:Math.ceil(document.documentElement.scrollHeight)},"*"))}
function dims(a){const d=a.dimensions||{};if(!d.width&&!d.height)return"";return[d.width,d.height,d.depth].filter(v=>v!==null&&v!==undefined&&v!=="").join(" × ")+" "+(d.unit||"cm")}
function dictText(ids,dict){return(ids||[]).map(id=>{const x=dict.find(d=>d.id===id);return x?pick(x.labels)||x.key||"":""}).filter(Boolean).join(", ")}
function row(label,value,cls=""){return value?'<div class="row"><b>'+esc(label)+'</b><span class="'+esc(cls)+'">'+esc(value)+'</span></div>':""}
async function run(){
 if(!slug){app.innerHTML='<div class="state">Artwork Info<br>Открой шаблон с параметром <b>?slug=…</b>, чтобы увидеть данные конкретной работы.</div>';notifySize();return}
 try{
  const [ar,sr,dr]=await Promise.all([fetch("../public-data/artworks.json",{cache:"no-store"}),fetch("../public-data/series.json",{cache:"no-store"}),fetch("../public-data/dictionaries.json",{cache:"no-store"})]);
  if(!ar.ok)throw new Error("artworks");
  const artworks=await ar.json(),series=sr.ok?await sr.json():[],dict=dr.ok?await dr.json():[];
  const a=artworks.find(x=>x.slug===slug||x.id===slug);
  if(!a){app.innerHTML='<div class="state">'+(lang==="en"?"Artwork not found or not published.":"Работа не найдена или не опубликована.")+'</div>';notifySize();return}
  const ser=series.find(s=>s.id===a.seriesId);
  const title=pick(a.title)||(lang==="en"?"Untitled":"Без названия");
  const status=statusLabels[lang][a.commercialStatus]||a.commercialStatus||"";
  const category=categoryLabels[lang][a.category]||a.category||"";
  const technique=dictText(a.techniqueIds,dict),materials=dictText(a.materialIds,dict),support=dictText(a.supportId?[a.supportId]:[],dict),tags=dictText(a.tagIds,dict);
  const seriesTitle=ser?(pick(ser.title)||pick(ser.name)||ser.slug||""):"";
  app.innerHTML='<div class="eyebrow">'+esc(category)+'</div><h1>'+esc(title)+'</h1>'+(a.year?'<div class="year">'+esc(a.year)+'</div>':"")+'<div class="facts">'+row(labels.status,status,"status "+(a.commercialStatus||""))+row(labels.size,dims(a))+row(labels.technique,technique)+row(labels.materials,materials)+row(labels.support,support)+row(labels.series,seriesTitle)+row(labels.tags,tags)+'</div>';
  notifySize();
 }catch(e){app.innerHTML='<div class="state">'+(lang==="en"?"Could not load artwork information.":"Не удалось загрузить информацию о работе.")+'</div>';notifySize()}
}
run();window.addEventListener("resize",notifySize);
</script>
</body>
</html>
